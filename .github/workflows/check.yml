name: check

# The app has no build step, so nothing else was ever going to catch a broken
# reference before it reached Vercel. This runs on every push to main and on PRs.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check.mjs
      # check.mjs catches a control that has stopped being wired to anything.
      # These catch wrong rules — the part that shows up live on a stream.
      - run: node --test scripts/logic.test.mjs scripts/sports.test.mjs
