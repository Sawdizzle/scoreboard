<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scoreboard Theme: Classic Green</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;800;900&family=Big+Shoulders+Stencil:wght@800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CLASSIC GREEN — a hand-operated ballpark scoreboard
   Painted green steel, dark number plates that flip,
   incandescent count bulbs, brass rivets, a hung K card.
   ============================================================ */
:root{
  --green:#1F4B38;        /* painted board */
  --green-deep:#153627;   /* shadowed paint */
  --plate:#0E241B;        /* number plates */
  --chalk:#F2EDDD;        /* painted numerals */
  --trim:#2A221B;         /* iron/wood frame */
  --brass:#B8955E;        /* rivets + rules */
  --amber:#FFB23E;        /* strike + base bulbs */
  --lime:#8BE28A;         /* ball bulbs */
  --red:#E4462F;          /* out bulbs + K */
  --num:"Big Shoulders Stencil","Big Shoulders","Impact","Arial Narrow",sans-serif;
  --txt:"Big Shoulders","Impact","Arial Narrow",sans-serif;
}
#stage{font-family:var(--txt);color:var(--chalk)}
body{--demo-accent:var(--amber)}
body.preview{background:radial-gradient(ellipse at 50% 120%,#3b6b3f 0%,#1d3322 45%,#0d1510 100%)}

/* ---------- Scorebug ---------- */
.board{
  position:relative;display:flex;gap:18px;padding:16px 18px 14px 14px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 7px),
    radial-gradient(ellipse at 30% 0%,rgba(255,255,255,.07),transparent 60%),
    linear-gradient(180deg,var(--green) 0%,var(--green-deep) 100%);
  border:7px solid var(--trim);border-radius:6px;
  box-shadow:0 0 0 2px rgba(184,149,94,.55) inset,0 14px 30px rgba(0,0,0,.45),0 3px 0 #120e0a;
}
/* brass rivets in each corner */
.board::before,.board::after,.rivets::before,.rivets::after{
  content:"";position:absolute;width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f3dca8,var(--brass) 45%,#5e4524 100%);
  box-shadow:0 1px 1px rgba(0,0,0,.6);
}
.board::before{left:5px;top:5px}.board::after{right:5px;top:5px}
.rivets::before{left:5px;bottom:5px}.rivets::after{right:5px;bottom:5px}
.rivets{position:absolute;inset:0;pointer-events:none}

.lines{display:grid;grid-template-columns:10px 330px repeat(3,62px);column-gap:8px;row-gap:8px;align-items:center}
.col-h{font-family:var(--txt);font-weight:800;font-size:20px;color:var(--brass);text-align:center;letter-spacing:.04em;line-height:1}
.team-row{display:contents}
.chip{width:10px;height:62px;border-radius:2px;background:var(--team,#888);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.name{position:relative;height:62px;display:flex;align-items:center;padding-left:6px;overflow:hidden;
  font-weight:900;font-size:40px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;text-overflow:ellipsis;line-height:1}
.name .t{display:block;overflow:hidden;text-overflow:ellipsis;padding-right:26px;min-width:0}
.name .bat{position:absolute;right:4px;top:50%;width:0;height:0;margin-top:-7px;border-left:12px solid var(--amber);
  border-top:7px solid transparent;border-bottom:7px solid transparent;opacity:0;transition:opacity .3s;filter:drop-shadow(0 0 6px var(--amber))}
.name.batting .bat{opacity:1}
/* light sweep across a team row when they score */
.name::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,210,120,.55) 50%,transparent 70%);transform:translateX(-120%)}
.name.scored::after{animation:sweep 1.1s ease-in-out 2}
@keyframes sweep{to{transform:translateX(120%)}}

/* number plates */
.plate{position:relative;width:62px;height:62px;perspective:260px;border-radius:3px;
  background:linear-gradient(180deg,#132f23 0%,var(--plate) 50%,#0b1d15 50%,#0f271d 100%);
  box-shadow:inset 0 2px 3px rgba(0,0,0,.7),inset 0 -1px 0 rgba(255,255,255,.06),0 1px 0 rgba(255,255,255,.07)}
.plate::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.65)}
.plate .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--num);font-weight:900;font-size:52px;line-height:1;color:var(--chalk);
  text-shadow:0 1px 0 rgba(0,0,0,.4);backface-visibility:hidden;transform-origin:50% 50%}
.plate.runs .v{color:#fff}
.plate.pop{animation:plateGlow 1.4s ease-out}
@keyframes plateGlow{0%{box-shadow:0 0 0 3px var(--amber),0 0 26px 6px rgba(255,178,62,.7)}100%{box-shadow:inset 0 2px 3px rgba(0,0,0,.7)}}

/* right-hand panel: inning + diamond */
.side{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding-left:18px;border-left:2px solid rgba(184,149,94,.35)}
.inning{display:flex;align-items:center;gap:8px}
.arrows{display:flex;flex-direction:column;gap:6px}
.arrow{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;opacity:.2;transition:opacity .35s,filter .35s}
.arrow.up{border-bottom:13px solid var(--amber)}
.arrow.down{border-top:13px solid var(--amber)}
.arrow.on{opacity:1;filter:drop-shadow(0 0 7px var(--amber))}
.diamond{position:relative;width:92px;height:70px;margin-top:6px}
.base{position:absolute;width:26px;height:26px;transform:rotate(45deg);border:3px solid rgba(242,237,221,.55);background:rgba(0,0,0,.25);transition:background .35s,border-color .35s,box-shadow .35s}
.base.b2{left:33px;top:2px}.base.b1{left:62px;top:31px}.base.b3{left:4px;top:31px}
.base.on{background:var(--amber);border-color:#ffe2a8;box-shadow:0 0 14px 3px rgba(255,178,62,.75)}

/* count strip hung under the board */
.strip{position:relative;display:flex;align-items:center;gap:26px;margin:0 16px;padding:10px 18px 11px;
  background:linear-gradient(180deg,#1a1510,var(--trim));border-radius:0 0 6px 6px;
  box-shadow:0 10px 22px rgba(0,0,0,.45);font-weight:800;font-size:22px;line-height:1}
.grp{display:flex;align-items:center;gap:8px}
.grp b{color:var(--brass);font-weight:800;margin-right:2px}
.bulb{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3a34,#171713 70%);box-shadow:inset 0 -2px 3px rgba(0,0,0,.6);transition:background .18s,box-shadow .18s}
.bulb.on{--c:var(--amber);background:radial-gradient(circle at 35% 30%,#fff 0%,var(--c) 45%,color-mix(in srgb,var(--c) 55%,#000) 100%);box-shadow:0 0 10px 2px color-mix(in srgb,var(--c) 70%,transparent)}
.grp.balls .bulb.on{--c:var(--lime)}
.grp.outs .bulb.on{--c:var(--red)}
.batter{margin-left:auto;color:var(--chalk);font-weight:600;font-size:22px;white-space:nowrap}
.batter .pc{color:var(--brass);font-weight:800;margin-left:10px}

/* +RUN tab that slides out from under the board */
#runTab{position:absolute;left:100%;top:0;margin-left:-10px;padding:10px 22px 10px 26px;background:var(--amber);color:#2a1a05;
  font-family:var(--num);font-weight:900;font-size:38px;line-height:1;border-radius:0 6px 6px 0;
  clip-path:inset(0 0 0 100%);transition:clip-path .45s cubic-bezier(.3,1.3,.5,1);box-shadow:0 8px 18px rgba(0,0,0,.4);white-space:nowrap}
#runTab.show{clip-path:inset(0 0 0 0)}

/* ---------- Home run banner ---------- */
#hr{position:absolute;left:50%;top:340px;width:1160px;margin-left:-580px;padding:44px 50px 38px;text-align:center;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 2px,transparent 2px 8px),
    linear-gradient(180deg,var(--green),var(--green-deep));
  border:10px solid var(--trim);border-radius:10px;box-shadow:0 0 0 3px var(--brass) inset,0 30px 60px rgba(0,0,0,.55);
  transform:translateY(-900px);visibility:hidden}
#hr.play{visibility:visible;animation:hrDrop 4.8s cubic-bezier(.25,1,.35,1) forwards}
@keyframes hrDrop{
  0%{transform:translateY(-900px) rotate(-2deg)}
  14%{transform:translateY(18px) rotate(.6deg)}
  20%{transform:translateY(-6px) rotate(-.3deg)}
  25%,86%{transform:translateY(0) rotate(0)}
  100%{transform:translateY(-900px) rotate(1deg)}
}
.marquee{position:absolute;inset:10px;pointer-events:none}
.mb{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#3c3a2e}
#hr.play .mb{animation:chase .5s steps(1) infinite}
@keyframes chase{0%{background:#fff3c4;box-shadow:0 0 10px 3px var(--amber)}34%,100%{background:#3c3a2e;box-shadow:none}}
.hr-word{display:flex;justify-content:center;gap:12px}
.hr-word .gap{width:44px}
.lp{width:112px;height:150px;perspective:500px;border-radius:5px;background:linear-gradient(180deg,#132f23 0%,var(--plate) 50%,#0b1d15 50%,#0f271d 100%);
  box-shadow:inset 0 3px 5px rgba(0,0,0,.7);position:relative}
.lp::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(0,0,0,.6)}
.lp span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:900;font-size:136px;line-height:1;color:var(--chalk);
  transform:rotateX(-90deg);transform-origin:50% 50%}
#hr.play .lp span{animation:letterIn .5s cubic-bezier(.2,1.5,.4,1) forwards;animation-delay:calc(.55s + var(--i) * .09s)}
@keyframes letterIn{to{transform:rotateX(0)}}
.hr-who{margin-top:26px;font-weight:900;font-size:58px;text-transform:uppercase;letter-spacing:.02em;line-height:1;opacity:0}
.hr-sub{margin-top:10px;font-weight:600;font-size:32px;color:var(--brass);line-height:1;opacity:0}
#hr.play .hr-who{animation:fadeUp .5s ease-out 1.5s forwards}
#hr.play .hr-sub{animation:fadeUp .5s ease-out 1.75s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- Hung K card ---------- */
#kcard{position:absolute;top:0;left:760px;width:190px;transform-origin:50% 0;visibility:hidden}
#kcard .rope{width:3px;height:90px;margin:0 auto;background:linear-gradient(#8a7555,#5d4a30)}
#kcard .card{position:relative;height:240px;background:linear-gradient(180deg,#f7f2e3,#e9e1ca);border-radius:6px;
  box-shadow:0 18px 30px rgba(0,0,0,.45),inset 0 0 0 4px #fff,inset 0 0 0 6px rgba(0,0,0,.08);
  display:flex;align-items:center;justify-content:center}
#kcard .card::before{content:"";position:absolute;top:10px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3dca8,var(--brass) 45%,#5e4524)}
#kcard .k{font-family:var(--num);font-weight:900;font-size:160px;line-height:1;color:var(--red);margin:0 0 22px;
  text-shadow:2px 3px 0 rgba(120,20,10,.25)}
#kcard.looking .k{transform:scaleX(-1)}
#kcard .kl{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-weight:800;font-size:22px;color:#6b5a3e}
#kcard.play{visibility:visible;animation:kSwing 3.2s forwards}
@keyframes kSwing{
  0%{transform:translateY(-420px) rotate(0)}
  16%{transform:translateY(0) rotate(14deg)}
  30%{transform:rotate(-9deg)}
  44%{transform:rotate(5deg)}
  56%{transform:rotate(-2deg)}
  66%,84%{transform:rotate(0)}
  100%{transform:translateY(-420px) rotate(0)}
}

@media (prefers-reduced-motion:reduce){
  #hr.play,#kcard.play{animation-duration:2.6s}
  .name.scored::after{animation:none}
}
</style>
</head>
<body>
<div id="stage">

  <!-- SCOREBUG -->
  <div id="bug">
    <div class="board">
      <div class="rivets"></div>
      <div class="lines">
        <span></span><span></span>
        <span class="col-h">R</span><span class="col-h">H</span><span class="col-h">E</span>

        <div class="team-row">
          <div class="chip" data-chip="away"></div>
          <div class="name" data-name="away"><span class="t"></span><i class="bat"></i></div>
          <div class="plate runs" data-k="away.r"><span class="v">0</span></div>
          <div class="plate" data-k="away.h"><span class="v">0</span></div>
          <div class="plate" data-k="away.e"><span class="v">0</span></div>
        </div>
        <div class="team-row">
          <div class="chip" data-chip="home"></div>
          <div class="name" data-name="home"><span class="t"></span><i class="bat"></i></div>
          <div class="plate runs" data-k="home.r"><span class="v">0</span></div>
          <div class="plate" data-k="home.h"><span class="v">0</span></div>
          <div class="plate" data-k="home.e"><span class="v">0</span></div>
        </div>
      </div>

      <div class="side">
        <div class="inning">
          <div class="arrows"><i class="arrow up"></i><i class="arrow down"></i></div>
          <div class="plate" data-k="inning"><span class="v">1</span></div>
        </div>
        <div class="diamond">
          <i class="base b2"></i><i class="base b3"></i><i class="base b1"></i>
        </div>
      </div>
      <div id="runTab"></div>
    </div>

    <div class="strip">
      <div class="grp balls"><b>B</b><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i></div>
      <div class="grp strikes"><b>S</b><i class="bulb"></i><i class="bulb"></i></div>
      <div class="grp outs"><b>O</b><i class="bulb"></i><i class="bulb"></i></div>
      <div class="batter"><span class="bn"></span><span class="pc"></span></div>
    </div>
  </div>

  <!-- HOME RUN BANNER -->
  <div id="hr">
    <div class="marquee"></div>
    <div class="hr-word"></div>
    <div class="hr-who"></div>
    <div class="hr-sub"></div>
  </div>

  <!-- K CARD -->
  <div id="kcard">
    <div class="rope"></div>
    <div class="card"><div class="k">K</div><div class="kl"></div></div>
  </div>
</div>

<script src="kit.js"></script>
<script>
(() => {
  const { $, $$, restart, battingTeam } = BugKit;
  const stage = $("#stage"), bug = $("#bug");
  const hr = $("#hr"), kcard = $("#kcard"), runTab = $("#runTab");
  const plate = (k) => $(`[data-k="${k}"]`);

  /* Flip a number plate: fold the old numeral away, fold the new one in. */
  function flip(el, val, instant){
    const v = el.querySelector(".v");
    const next = String(val);
    if (v.textContent === next) return;
    if (instant) { v.textContent = next; return; }
    v.animate([{transform:"rotateX(0)"},{transform:"rotateX(-90deg)"}],{duration:150,easing:"ease-in"}).onfinish = () => {
      v.textContent = next;
      v.animate([{transform:"rotateX(90deg)"},{transform:"rotateX(0)"}],{duration:260,easing:"cubic-bezier(.2,1.5,.4,1)"});
    };
  }

  /* Marquee bulbs around the home run banner edge, built once. */
  (function buildMarquee(){
    const m = $(".marquee", hr), W = 1120, H = 330, gap = 34, pts = [];
    for (let x=0;x<=W;x+=gap) pts.push([x,0]);
    for (let y=gap;y<=H;y+=gap) pts.push([W,y]);
    for (let x=W-gap;x>=0;x-=gap) pts.push([x,H]);
    for (let y=H-gap;y>0;y-=gap) pts.push([0,y]);
    pts.forEach(([x,y],i) => {
      const b = document.createElement("i"); b.className = "mb";
      b.style.left = (x/W*100)+"%"; b.style.top = (y/H*100)+"%";
      b.style.animationDelay = `${-(i%3)*0.166}s`;
      m.appendChild(b);
    });
  })();

  let pos = "tl", runTimer;
  BugKit.start({
    name: "Classic Green",
    hrDelay: 1800,
    place(p){ pos = p; },
    render(S, prev, first){
      for (const t of ["away","home"]){
        $(`[data-name="${t}"] .t`).textContent = S[t].name;
        $(`[data-chip="${t}"]`).style.setProperty("--team", S[t].color);
        for (const f of ["r","h","e"]) flip(plate(`${t}.${f}`), S[t][f], first);
        $(`[data-name="${t}"]`).classList.toggle("batting", battingTeam(S) === t);
      }
      flip(plate("inning"), S.inning, first);
      $(".arrow.up").classList.toggle("on", S.half==="top");
      $(".arrow.down").classList.toggle("on", S.half!=="top");
      ["b1","b2","b3"].forEach((b,i) => $("."+b).classList.toggle("on", !!S.bases[i]));
      $$(".balls .bulb").forEach((el,i)=>el.classList.toggle("on", i < S.balls));
      $$(".strikes .bulb").forEach((el,i)=>el.classList.toggle("on", i < S.strikes));
      $$(".outs .bulb").forEach((el,i)=>el.classList.toggle("on", i < S.outs));
      $(".bn").textContent = S.batter || "";
      $(".pc").textContent = S.pitchCount ? `P ${S.pitchCount}` : "";
    },
    fx: {
      run({ team, runs = 1 }, S){
        team ||= battingTeam(S);
        restart($(`[data-name="${team}"]`), "scored");
        restart(plate(`${team}.r`), "pop");
        runTab.textContent = runs === 1 ? "+1 RUN" : `+${runs} RUNS`;
        runTab.style.top = team==="away" ? "44px" : "114px";
        runTab.classList.add("show");
        clearTimeout(runTimer); runTimer = setTimeout(()=>runTab.classList.remove("show"), 2600);
      },
      hr({ runs = 1, batter }, S){
        const word = $(".hr-word", hr); word.innerHTML = "";
        [..."HOME RUN"].forEach((ch,i) => {
          if (ch === " ") { word.insertAdjacentHTML("beforeend",'<i class="gap"></i>'); return; }
          word.insertAdjacentHTML("beforeend", `<div class="lp" style="--i:${i}"><span>${ch}</span></div>`);
        });
        $(".hr-who", hr).textContent = batter || S.batter || "";
        $(".hr-sub", hr).textContent = runs===4 ? "Grand slam" : runs===1 ? "Solo shot" : `${runs} runs score`;
        restart(hr, "play");
      },
      k({ looking } = {}){
        kcard.classList.toggle("looking", !!looking);
        $(".kl", kcard).textContent = looking ? "Caught looking" : "Strikeout";
        // hang the card just right of the scorebug
        const r = bug.getBoundingClientRect(), s = stage.getBoundingClientRect(), k = s.width/1920;
        kcard.style.left = (pos.endsWith("r") ? (r.left - s.left)/k - 230 : (r.right - s.left)/k + 40) + "px";
        kcard.style.top = pos.startsWith("b") ? "560px" : "0px";
        restart(kcard, "play");
      }
    }
  });
})();
</script>
</body>
</html>
