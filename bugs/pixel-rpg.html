<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scoreboard Theme: Battle Mode</title>
<link rel="preload" href="../fonts/bugs/press-start-2p-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Self-hosted fonts (latin subset), so nothing reaches a font CDN on air.
   Licenses: /fonts/bugs/LICENSES.md */
@font-face{font-family:'Press Start 2P';font-weight:400;font-display:swap;src:url('../fonts/bugs/press-start-2p-400.woff2') format('woff2')}
</style>
<style>
/* ============================================================
   BATTLE MODE — the at-bat as a 16-bit turn-based battle.
   Double-line pixel windows (a 9-slice SVG frame scaled 2x),
   banded blue fills, sprite icons built from pixel maps,
   a typewriter dialog box, damage numbers and screen shake.
   ============================================================ */
:root{
  --ink:#05061a;  --white:#f4f4ff; --silver:#b8bde8; --line:#5a66d8;
  --gold:#ffd23a; --green:#5cf07c; --orange:#ff9a2a; --red:#ff3b5c; --ice:#8ee8ff;
  --px:"Press Start 2P",ui-monospace,monospace;
}
body{--demo-accent:#ffd23a}
body.preview{background:
  radial-gradient(ellipse at 50% 125%,#6d5a3c 0%,#4a3b27 17%,transparent 18%),
  radial-gradient(ellipse at 50% 110%,#35623a 0%,#1d3a26 48%,#0b1510 100%)}
#stage{font-family:var(--px);color:var(--white);-webkit-font-smoothing:none;font-smooth:never}
svg{display:block;shape-rendering:crispEdges}

/* ---------- Pixel window ---------- */
.win{position:relative;border:10px solid transparent;border-image:var(--frame) 5 stretch;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,10,.10) 0 2px,transparent 2px 4px),
    linear-gradient(180deg,#3747d2 0 13%,#2e3ec3 13% 29%,#2635b0 29% 46%,#1e2b9b 46% 64%,#172285 64% 82%,#111a6c 82%);
  background-clip:padding-box;padding:8px 14px;text-shadow:3px 3px 0 var(--ink);
  filter:drop-shadow(6px 6px 0 rgba(0,0,8,.45))}
.win::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.win.flash::after{animation:wflash .6s steps(1) both}
@keyframes wflash{0%{opacity:.95}17%{opacity:0}33%{opacity:.85}50%{opacity:0}67%{opacity:.7}83%,100%{opacity:0}}
.win.blink{animation:vblink .9s steps(1) both}
@keyframes vblink{0%,25%,50%,75%{opacity:0}12.5%,37.5%,62.5%,87.5%,100%{opacity:1}}
.win.enter{animation:enter .28s steps(1) both}
@keyframes enter{0%{opacity:0}34%{opacity:1}67%{opacity:.35}100%{opacity:1}}
em{font-style:normal;color:var(--gold);font-size:16px;line-height:1}

/* ---------- Cluster layout ---------- */
.cluster{position:relative;display:grid;grid-template-columns:488px 216px;gap:8px;width:712px}
.duo{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* party (score) window */
.party{display:flex;flex-direction:column;justify-content:center;gap:12px;padding:8px 14px 8px 10px}
.row{display:grid;grid-template-columns:22px 30px 1fr 84px 70px 70px;column-gap:8px;align-items:center;height:44px}
.cur{opacity:0}
.row.bat .cur{opacity:1;animation:curBlink 1.1s steps(1) infinite}
@keyframes curBlink{70%{opacity:0}}
.ab{font-size:24px;line-height:1;white-space:nowrap;overflow:hidden;font-weight:400}
.st{display:flex;align-items:baseline;justify-content:flex-start;gap:8px}
.st .v{font-weight:400;font-size:24px;line-height:1;display:inline-block}
.st.r .v{font-size:32px}
.v.bump{animation:bump .36s steps(3) both}
@keyframes bump{0%{transform:translateY(-10px) scale(1.35);color:var(--gold)}100%{transform:none}}
.v.err{animation:errPop .8s steps(4) both}
@keyframes errPop{0%{color:var(--red);transform:scale(1.4)}100%{color:inherit;transform:none}}

/* field window: inning, diamond, hearts */
.field{display:grid;grid-template-columns:52px 112px;column-gap:8px;row-gap:6px;padding:8px 12px;align-content:center}
.inn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.inn .v{font-size:32px;line-height:1}
.inn .ar{order:0}.inn.bot .ar{order:2}
.dia{position:relative;width:112px;height:82px}
.base,.hplate{position:absolute}
.base .on,.base.on .off{display:none}.base.on .on{display:block}
.base.b2{left:38px;top:0}.base.b3{left:4px;top:30px}.base.b1{left:72px;top:30px}
.hplate{left:46px;top:64px}
.base.pop{animation:pop .4s steps(3) both}
@keyframes pop{0%{transform:scale(1.7)}100%{transform:none}}
.hearts{grid-column:1/-1;display:flex;justify-content:center;gap:8px;height:24px}
.heart .off,.heart.lost .on{display:none}.heart.lost .off{display:block}
.heart.break .on{display:block;animation:vblink .7s steps(1) both}.heart.break .off{display:none}

/* pitcher + batter windows */
.duo .win{display:flex;flex-direction:column;gap:12px;padding:10px 14px}
.pitw{order:2}.cluster.bot .pitw{order:0}
.nm{display:flex;align-items:center;gap:10px;height:30px}
.nm b{font-weight:400;font-size:24px;line-height:1;white-space:nowrap}
.stat{display:flex;align-items:center;gap:8px;height:28px}
.stat .v{font-weight:400;font-size:24px;line-height:1}
.stat .tico{margin-left:auto}
.pips{display:flex;gap:4px;margin-right:12px}
.pip .on,.pip.on .off{display:none}.pip.on .on{display:block}
.pip,.heart,.base{display:block}
.pip.pop{animation:pop .36s steps(3) both}
.slash{position:absolute;left:-8%;width:116%;height:14px;background:var(--white);box-shadow:0 0 0 3px var(--ink);
  transform:rotate(-18deg);pointer-events:none;z-index:3}

/* dialog window */
#dlg{position:absolute;left:0;width:712px;min-height:76px;padding:14px 22px 14px 20px;visibility:hidden;z-index:4;transform-origin:50% 0}
body[data-pos^="t"] #dlg{top:calc(100% + 8px)}
body[data-pos^="b"] #dlg{bottom:calc(100% + 8px);transform-origin:50% 100%}
#dlg.open{visibility:visible;animation:dlgOpen .16s steps(1) both}
#dlg.closing{visibility:visible;animation:dlgClose .16s steps(1) both}
@keyframes dlgOpen{0%{transform:scaleY(.12)}34%{transform:scaleY(.45)}67%{transform:scaleY(.8)}100%{transform:none}}
@keyframes dlgClose{0%{transform:scaleY(.8)}34%{transform:scaleY(.45)}67%{transform:scaleY(.12)}100%{transform:scaleY(0)}}
.txt{font-size:24px;line-height:40px;padding-right:22px}
.txt .c{opacity:0}.txt .c.on{opacity:1}
.txt .c svg{display:inline-block;vertical-align:-2px}
.txt.gold{color:var(--gold);font-size:32px}
.txt.ice{color:var(--ice)}
.txt.red{color:#ff8a9c}
.more{position:absolute;right:16px;bottom:10px;opacity:0}
#dlg.wait .more{opacity:1;animation:more .5s steps(1) infinite}
@keyframes more{50%{transform:translateY(4px)}}

/* half-inning battle transition */
.wipe{position:absolute;left:-6px;top:-6px;width:728px;height:270px;overflow:hidden;pointer-events:none;z-index:6}
.wipe i{position:absolute;width:26px;height:26px;background:var(--ink);transform:scale(0)}
.wipe i.w{background:#0d1250}

/* ---------- Stage-level effects ---------- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:10}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#flash.go{animation:sflash .22s steps(2) both}
@keyframes sflash{0%{opacity:.6}100%{opacity:0}}
.fxo{position:absolute;left:0;top:0}
.pxl{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;box-shadow:0 0 0 2px var(--ink)}
.spk{animation:spk .5s steps(4) both}
.spk.big{animation-duration:.7s}
@keyframes spk{0%{transform:translate(-50%,-50%) scale(0)}50%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(0)}}
.dmg{font-size:64px;line-height:1;color:var(--gold);white-space:nowrap;transform:translate(-50%,0);
  text-shadow:4px 0 0 var(--ink),-4px 0 0 var(--ink),0 4px 0 var(--ink),0 -4px 0 var(--ink),4px 4px 0 var(--ink),-4px 4px 0 var(--ink),4px -4px 0 var(--ink),-4px -4px 0 var(--ink),8px 8px 0 rgba(0,0,8,.5);
  animation:dmg 1.9s both}
.dmg.sm{font-size:32px;color:var(--white);animation-duration:1.1s}
.dmg.heal{font-size:48px;color:var(--green)}
.dmg.big{font-size:96px}
@keyframes dmg{
  0%{transform:translate(-50%,0) scale(.5)}
  10%{transform:translate(-50%,-78px) scale(1.12)}
  20%{transform:translate(-50%,-26px) scale(1)}
  28%{transform:translate(-50%,-46px)}
  36%,78%{transform:translate(-50%,-34px);opacity:1}
  80%,84%,88%{opacity:0}82%,86%,90%{opacity:1}
  100%{transform:translate(-50%,-60px);opacity:0}}
.ksp{display:flex;flex-direction:column;align-items:center;gap:14px;animation:kIn 3s both}
.ksp .lbl{font-size:24px;color:var(--white);text-shadow:3px 3px 0 var(--ink)}
.ksp.look .lbl{color:var(--ice)}
.ksp.look .spr{transform:scaleX(-1)}
@keyframes kIn{
  0%{transform:scale(2.4);opacity:0}4%{transform:scale(2.4);opacity:1}8%{transform:scale(1.6)}12%{transform:scale(.9)}16%,82%{transform:scale(1);opacity:1}
  84%,88%,92%,96%{opacity:0}86%,90%,94%{opacity:1}100%{transform:scale(1);opacity:0}}
.frost{position:absolute;width:6px;height:6px;background:var(--ice);box-shadow:0 0 0 2px var(--ink)}
.runner{position:absolute;left:0;top:0;z-index:2}

@media (prefers-reduced-motion:reduce){
  .row.bat .cur,#dlg.wait .more{animation:none}
  .dmg{animation-duration:1.4s}
}
</style>
</head>
<body>
<div id="stage">

  <div id="bug">
    <div class="cluster">
      <!-- party list: the two teams -->
      <div class="win party">
        <div class="row" data-team="away"><i class="cur"></i><i class="ico"></i><b class="ab"></b>
          <span class="st r"><em>R</em><b class="v">0</b></span><span class="st h"><em>H</em><b class="v">0</b></span><span class="st e"><em>E</em><b class="v">0</b></span></div>
        <div class="row" data-team="home"><i class="cur"></i><i class="ico"></i><b class="ab"></b>
          <span class="st r"><em>R</em><b class="v">0</b></span><span class="st h"><em>H</em><b class="v">0</b></span><span class="st e"><em>E</em><b class="v">0</b></span></div>
      </div>

      <!-- field: inning, bases, outs as hearts -->
      <div class="win field">
        <div class="inn"><i class="ar"></i><b class="v">1</b></div>
        <div class="dia"><i class="base b2"></i><i class="base b3"></i><i class="base b1"></i><i class="hplate"></i></div>
        <div class="hearts"><i class="heart"></i><i class="heart"></i><i class="heart"></i></div>
      </div>

      <!-- the duel -->
      <div class="duo">
        <div class="win pitw">
          <div class="nm"><i class="spr sball"></i><b class="pn"></b></div>
          <div class="stat"><em>PC</em><b class="v pcv">0</b><i class="tico"></i></div>
        </div>
        <div class="win batw">
          <div class="nm"><i class="spr sbat"></i><b class="bn"></b></div>
          <div class="stat"><em>B</em><span class="pips balls"><i class="pip"></i><i class="pip"></i><i class="pip"></i></span>
            <em>S</em><span class="pips strikes"><i class="pip"></i><i class="pip"></i></span><i class="tico"></i></div>
        </div>
      </div>

      <!-- dialog box -->
      <div class="win" id="dlg"><div class="txt"></div><i class="more"></i></div>
    </div>
  </div>

  <div id="flash"></div>
  <div id="fx"></div>
</div>

<script src="kit.js"></script>
<script>
(() => {
  const { $, $$, restart, battingTeam, fieldingTeam } = BugKit;
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const stage = $("#stage"), bug = $("#bug"), cl = $(".cluster"), fx = $("#fx"), dlg = $("#dlg");
  const dia = $(".dia"), batw = $(".batw"), pitw = $(".pitw");

  /* ---------- Sprite engine: pixel maps -> crisp inline SVG ----------
     Each map is rows of chars; the palette maps a char to a fill.
     outline:true wraps every lit pixel in a 1px ink border. */
  const INK = "#05061a";
  function sprite(rows, pal, px = 3, outline = true){
    let g = rows.map(r => [...r]);
    if (outline){
      const h = g.length + 2, w = g[0].length + 2;
      const o = Array.from({length:h}, (_, y) => Array.from({length:w}, (_, x) => g[y-1]?.[x-1] ?? "."));
      for (let y=0;y<h;y++) for (let x=0;x<w;x++){
        if (o[y][x] !== ".") continue;
        const lit = (yy,xx) => { const c = g[yy-1]?.[xx-1]; return c && c !== "." && c !== "#"; };
        if (lit(y-1,x)||lit(y+1,x)||lit(y,x-1)||lit(y,x+1)) o[y][x] = "#";
      }
      g = o;
    }
    const P = { "#": INK, ...pal };
    let rects = "";
    g.forEach((r, y) => {
      for (let x = 0; x < r.length;){
        const c = r[x]; let n = 1;
        while (r[x+n] === c) n++;
        if (c !== "." && P[c]) rects += `<rect x="${x}" y="${y}" width="${n}" height="1" fill="${P[c]}"/>`;
        x += n;
      }
    });
    const W = g[0].length, H = g.length;
    return `<svg width="${W*px}" height="${H*px}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${rects}</svg>`;
  }

  /* 9-slice window frame: outline, white, silver, dark gap, blue rule, notched corners. */
  (function frame(){
    const TL = ["..OOO", ".OWWW", "OWWSS", "OWSDD", "OWSDB"], EDGE = "OWSDB";
    const rows = [];
    for (let y=0;y<11;y++){
      let r = "";
      for (let x=0;x<11;x++){
        const ty = y<=5 ? y : 10-y, tx = x<=5 ? x : 10-x;
        r += ty<5 && tx<5 ? TL[ty][tx] : ty<5 ? EDGE[ty] : tx<5 ? EDGE[tx] : ".";
      }
      rows.push(r);
    }
    const svg = sprite(rows, { O:INK, W:"#f4f4ff", S:"#b8bde8", D:INK, B:"#6f7be6" }, 1, false)
      .replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" ');
    document.documentElement.style.setProperty("--frame", `url("data:image/svg+xml,${encodeURIComponent(svg)}")`);
  })();

  const TEAM = "currentColor", HI = "rgba(255,255,255,.6)", SH = "rgba(0,0,10,.35)";
  const MAP = {
    shield: ["XXXXXXXX","XHHXXXXX","XHXXXXXD","XXXXXXXD","XXXXXXXD",".XXXXXD.","..XXXD..","...XD..."],
    heart:  [".RR.RR.","RHRRRRR","RRRRRRD",".RRRRD.","..RRD..","...D..."],
    base:   ["...H...","..HGG..",".HGGGG.","HGGGGGD",".GGGGD.","..GGD..","...D..."],
    plate:  ["WWWWW","WWWWW",".WWW.","..W.."],
    ball:   [".WWWW.","WRWWWS","WWRWWS","WWWRWS","WWWWRS",".SSSS."],
    bat:    ["......LB",".....LBB","....LBB.","...LBB..","..LBB...",".GB.....","GG......","G......."],
    cursor: ["W....","WW...","WWW..","WWWW.","WWS..","WS...","S...."],
    up:     ["...G...","..GGG..",".GGGGG.","GGGGGGG"],
    arrowR: ["G....","GG...","GGG..","GGGG.","GGG..","GG...","G...."],
    more:   ["GGGGGGG",".GGGGG.","..GGG..","...G..."],
    pip:    [".XXX.","XHXXX","XXXXX","XXXXS",".XSS."],
    spark:  ["...Y...","...W...","..YWY..","YWWWWWY","..YWY..","...W...","...Y..."],
    k:      ["HRR...RRR","HRR..RRR.","HRR.RRR..","HRRRRR...","HRRRR....","HRRRRR...","HRR.RRR..","HRR..RRR.","HRR...RRR","DDD...DDD"],
    runner: ["..SS.","..SS.",".XXX.","X.XX.","..XX.",".X..X","X...X"]
  };
  const SPR = {
    shield: sprite(MAP.shield, { X:TEAM, H:HI, D:SH }),
    tico:   sprite(MAP.shield, { X:TEAM, H:HI, D:SH }, 2),
    heartOn:  sprite(MAP.heart, { R:"#ff3b5c", H:"#fff", D:"#b3163a" }),
    heartOff: sprite(MAP.heart, { R:"#262a72", H:"#343a8e", D:"#1b1f5a" }),
    baseOn:   sprite(MAP.base, { G:"#ffd23a", H:"#fff3a8", D:"#c77a00" }, 4),
    baseOff:  sprite(MAP.base, { G:"#0d1256", H:"#7f8ae6", D:"#7f8ae6" }, 4),
    plate:  sprite(MAP.plate, { W:"#f4f4ff" }),
    ball:   sprite(MAP.ball, { W:"#f4f4ff", R:"#ff3b5c", S:"#b8bde8" }),
    bat:    sprite(MAP.bat, { L:"#f7d49a", B:"#d0893e", G:"#6a3b1a" }),
    cursor: sprite(MAP.cursor, { W:"#f4f4ff", S:"#b8bde8" }),
    up:     sprite(MAP.up, { G:"#ffd23a" }),
    down:   sprite([...MAP.up].reverse(), { G:"#ffd23a" }),
    arrowR: sprite(MAP.arrowR, { G:"#ffd23a" }, 3),
    more:   sprite(MAP.more, { G:"#f4f4ff" }, 3),
    ballPip: [sprite(MAP.pip, { X:"#1f2670", H:"#2a3288", S:"#1a2060" }), sprite(MAP.pip, { X:"#5cf07c", H:"#e6ffe9", S:"#1f9a45" })],
    strkPip: [sprite(MAP.pip, { X:"#1f2670", H:"#2a3288", S:"#1a2060" }), sprite(MAP.pip, { X:"#ff9a2a", H:"#fff0c0", S:"#b25300" })],
    spark:  sprite(MAP.spark, { Y:"#ffd23a", W:"#fff" }, 4),
    sparkS: sprite(MAP.spark, { Y:"#8ee8ff", W:"#fff" }, 3),
    kRed:   sprite(MAP.k, { R:"#ff3b5c", H:"#ff9aaa", D:"#9c1030" }, 12),
    kIce:   sprite(MAP.k, { R:"#6fd8ff", H:"#e8fbff", D:"#2479b8" }, 12),
    runner: sprite(MAP.runner, { X:TEAM, S:"#f2c39a" })
  };

  /* Paint the static sprites into the markup once. */
  $$(".cur").forEach(e => e.innerHTML = SPR.cursor);
  $$(".ico").forEach(e => e.innerHTML = SPR.shield);
  $$(".tico").forEach(e => e.innerHTML = SPR.tico);
  $$(".heart").forEach(e => e.innerHTML = `<span class="on">${SPR.heartOn}</span><span class="off">${SPR.heartOff}</span>`);
  $$(".base").forEach(e => e.innerHTML = `<span class="off">${SPR.baseOff}</span><span class="on">${SPR.baseOn}</span>`);
  $(".hplate").innerHTML = SPR.plate;
  $(".sball").innerHTML = SPR.ball;
  $(".sbat").innerHTML = SPR.bat;
  $(".more", dlg).innerHTML = SPR.more;
  $$(".balls .pip").forEach(e => e.innerHTML = `<span class="off">${SPR.ballPip[0]}</span><span class="on">${SPR.ballPip[1]}</span>`);
  $$(".strikes .pip").forEach(e => e.innerHTML = `<span class="off">${SPR.strkPip[0]}</span><span class="on">${SPR.strkPip[1]}</span>`);

  /* ---------- Geometry + transient effects ---------- */
  let pos = "tl";
  const onLeft = () => pos.endsWith("l"), onTop = () => pos.startsWith("t");
  function rectOf(el){
    const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect(), k = s.width / 1920;
    return { x:(r.left-s.left)/k, y:(r.top-s.top)/k, w:r.width/k, h:r.height/k };
  }
  const later = (ms, fn) => setTimeout(fn, ms);
  function spawn(html, cls, x, y, life){
    const d = document.createElement("div");
    d.className = "fxo " + cls; d.style.left = x + "px"; d.style.top = y + "px"; d.innerHTML = html;
    fx.appendChild(d); later(life, () => d.remove());
    return d;
  }
  function flashStage(){ if (!RM) restart($("#flash"), "go"); }
  function flashWins(els){ els.forEach(e => restart(e, "flash")); }
  function shake(el, amp = 10, ms = 520){
    if (RM) return;
    const f = [[0,0],[amp,-amp/2],[-amp,amp/2],[amp*.7,amp/3],[-amp*.7,-amp/3],[amp*.4,0],[-amp*.3,amp*.2],[0,0]];
    el.animate(f.map(([x,y]) => ({ transform:`translate(${Math.round(x)}px,${Math.round(y)}px)` })), { duration:ms, easing:"steps(1)" });
  }
  /* pixel sparkle sprites around a point */
  function sparkles(x, y, n = 4, spread = 46, small){
    for (let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, r = spread*(.4+Math.random()*.6);
      const s = spawn(small ? SPR.sparkS : SPR.spark, "spk", x + Math.cos(a)*r, y + Math.sin(a)*r, 700);
      s.style.animationDelay = (i*70) + "ms";
    }
  }
  /* pixel firework: a ring of square particles that burst, drift down and blink out */
  function firework(x, y, colors, n = 18, radius = 130){
    const g = spawn("", "", x, y, 1500);
    spawn(SPR.spark, "spk", x, y, 600);
    for (let i=0;i<n;i++){
      const p = document.createElement("i"); p.className = "pxl";
      p.style.background = colors[i % colors.length];
      if (i % 3 === 0) { p.style.width = p.style.height = "14px"; }
      g.appendChild(p);
      const a = (i/n)*Math.PI*2 + Math.random()*.2, r = radius*(.75+Math.random()*.35);
      const dx = Math.round(Math.cos(a)*r/4)*4, dy = Math.round(Math.sin(a)*r/4)*4;
      p.animate([
        { transform:"translate(0,0) scale(.5)", opacity:1 },
        { transform:`translate(${dx*.8}px,${dy*.8}px)`, opacity:1, offset:.35 },
        { transform:`translate(${dx}px,${dy+24}px)`, opacity:1, offset:.7 },
        { transform:`translate(${dx}px,${dy+60}px)`, opacity:0 }
      ], { duration:1300, easing:"steps(14)", fill:"both" });
    }
  }
  /* damage / heal numbers that bounce up and blink away */
  function dmg(text, x, y, cls = "", life = 1950){ return spawn(text, "dmg " + cls, x, y, life); }

  /* ---------- Dialog box: types line by line with a blinking ▼ ---------- */
  let dlgTok = 0;
  function say(lines, { hold = 1500, speed = 34 } = {}){
    const tok = ++dlgTok, txt = $(".txt", dlg);
    if (!dlg.classList.contains("open")) { dlg.classList.remove("closing"); restart(dlg, "open"); }
    let li = 0;
    const next = () => {
      if (tok !== dlgTok) return;
      const L = typeof lines[li] === "string" ? { t: lines[li] } : lines[li];
      txt.className = "txt " + (L.cls || "");
      txt.innerHTML = "";
      dlg.classList.remove("wait");
      if (L.flash) flashWins([dlg]);
      const chars = [];
      String(L.t).split(/(\{>\})/).forEach(part => {
        if (part === "{>}") { const s = document.createElement("span"); s.className = "c"; s.innerHTML = SPR.arrowR; s.style.display = "inline-block"; txt.appendChild(s); chars.push(s); return; }
        [...part].forEach(ch => { const s = document.createElement("span"); s.className = "c"; s.textContent = ch; txt.appendChild(s); chars.push(s); });
      });
      let i = 0;
      const type = () => {
        if (tok !== dlgTok) return;
        if (RM || L.instant) { chars.forEach(c => c.classList.add("on")); i = chars.length; }
        else { chars[i++]?.classList.add("on"); while (chars[i] && chars[i].textContent === " ") chars[i++].classList.add("on"); }
        if (i < chars.length) return later(speed, type);
        li++;
        if (li < lines.length) { dlg.classList.add("wait"); later(L.hold ?? 650, next); }
        else later(L.hold ?? hold, () => closeDlg(tok));
      };
      type();
    };
    next();
  }
  function closeDlg(tok){
    if (tok != null && tok !== dlgTok) return;
    dlgTok++;
    if (!dlg.classList.contains("open")) return;
    dlg.classList.remove("open", "wait"); restart(dlg, "closing");
    later(170, () => { dlg.classList.remove("closing"); if (!dlg.classList.contains("open")) $(".txt", dlg).innerHTML = ""; });
  }

  /* runner sprite hops from home around the bases on the diamond */
  const SPOT = [[46,44],[80,22],[46,-8],[12,22]];   // home, 1st, 2nd, 3rd (sprite top-left)
  let hopDelay = 0;
  function hop(to, color, walk){
    const r = document.createElement("i"); r.className = "runner"; r.innerHTML = SPR.runner; r.style.color = color;
    dia.appendChild(r);
    const leg = walk ? 520 : 360, frames = [];
    for (let b=0;b<to;b++){
      const [x0,y0] = SPOT[b], [x1,y1] = SPOT[b+1];
      frames.push({ transform:`translate(${x0}px,${y0}px)` });
      frames.push({ transform:`translate(${(x0+x1)/2}px,${(y0+y1)/2 - (walk ? 2 : 16)}px)` });
    }
    frames.push({ transform:`translate(${SPOT[to][0]}px,${SPOT[to][1]}px)` });
    const dur = leg * to;
    if (RM) { r.remove(); return 0; }
    r.animate(frames, { duration:dur, easing:"steps(" + (6*to) + ")", fill:"forwards" });
    later(dur + 260, () => r.remove());
    return dur;
  }

  /* ---------- Paint state ---------- */
  const surname = (n) => { const p = String(n || "").trim().split(/\s+/); return (p[p.length-1] || "").toUpperCase().slice(0, 10); };
  const val = (t, f) => $(`.row[data-team="${t}"] .st.${f} .v`);
  let shown = null, latest = null, deferPaint = false, baseTimer = null;

  /* run totals tick up one at a time, each step with a sparkle */
  function tick(el, from, to){
    clearInterval(el._t);
    if (!(to > from)) { el.textContent = to; return; }
    let v = from;
    const step = () => {
      el.textContent = ++v; restart(el, "bump");
      const r = rectOf(el); sparkles(r.x + r.w - 20, r.y + r.h/2, 3, 34);
      if (v >= to) clearInterval(el._t);
    };
    step();
    if (v < to) el._t = setInterval(step, 280);
  }
  function typeName(el, name, instant){
    clearInterval(el._t);
    if (instant || RM) { el.textContent = name; return; }
    let i = 0; el.textContent = "";
    el._t = setInterval(() => { el.textContent = name.slice(0, ++i); if (i >= name.length) clearInterval(el._t); }, 45);
  }
  function setBases(S, P, first, delay){
    clearTimeout(baseTimer);
    const go = () => $$(".dia .base").forEach(el => {
      const i = el.classList.contains("b1") ? 0 : el.classList.contains("b2") ? 1 : 2;
      const on = !!S.bases[i], was = el.classList.contains("on");
      el.classList.toggle("on", on);
      if (on && !was && !first) restart(el, "pop");
    });
    delay ? (baseTimer = setTimeout(go, delay)) : go();
  }

  function paint(S, first){
    const P = shown || S, bat = battingTeam(S), fld = fieldingTeam(S);
    for (const t of ["away", "home"]){
      const row = $(`.row[data-team="${t}"]`);
      $(".ico", row).style.color = S[t].color;
      $(".ab", row).textContent = (S[t].abbr || S[t].name || "").toUpperCase();
      row.classList.toggle("bat", bat === t);
      if (first) val(t, "r").textContent = S[t].r; else if (S[t].r !== P[t].r) tick(val(t, "r"), P[t].r, S[t].r);
      for (const f of ["h", "e"]){
        const el = val(t, f);
        if (String(S[t][f]) !== el.textContent){ el.textContent = S[t][f]; if (!first) restart(el, f === "e" ? "err" : "bump"); }
      }
    }
    // inning + half arrow
    const inn = $(".inn"), iv = $(".inn .v");
    if (iv.textContent !== String(S.inning)) { iv.textContent = S.inning; if (!first) restart(iv, "bump"); }
    inn.classList.toggle("bot", S.half !== "top");
    $(".inn .ar").innerHTML = S.half === "top" ? SPR.up : SPR.down;
    // bases (held back while a runner sprite is still hopping)
    setBases(S, P, first, first ? 0 : hopDelay); hopDelay = 0;
    // outs = hearts lost, rightmost first
    $$(".heart").forEach((h, i) => {
      const lost = i >= 3 - Math.min(3, S.outs), was = h.classList.contains("lost");
      h.classList.toggle("lost", lost);
      if (lost && !was && !first && !RM){
        restart(h, "break"); later(720, () => h.classList.remove("break"));
        const r = rectOf(h);
        later(560, () => firework(r.x + r.w/2, r.y + r.h/2, ["#ff3b5c", "#ffd0d8"], 8, 34));
      }
    });
    // count pips
    $$(".balls .pip").forEach((p, i) => { const on = i < S.balls, was = p.classList.contains("on"); p.classList.toggle("on", on); if (on && !was && !first) restart(p, "pop"); });
    $$(".strikes .pip").forEach((p, i) => { const on = i < Math.min(2, S.strikes), was = p.classList.contains("on"); p.classList.toggle("on", on); if (on && !was && !first) restart(p, "pop"); });
    // the duel: pitcher belongs to the fielding team, batter to the batting team
    $(".tico", pitw).style.color = S[fld].color; $(".tico", batw).style.color = S[bat].color;
    const pn = surname(S.pitcher || "PITCHER"), bn = surname(S.batter || "BATTER");
    if (first || pn !== surname(P.pitcher)) typeName($(".pn"), pn, first);
    if (first || bn !== surname(P.batter)) { typeName($(".bn"), bn, first); if (!first) restart(batw, "enter"); }
    const pc = $(".pcv"); if (pc.textContent !== String(S.pitchCount ?? 0)) pc.textContent = S.pitchCount ?? 0;
    pitw.querySelector(".stat").style.visibility = S.pitchCount ? "visible" : "hidden";
    cl.classList.toggle("bot", S.half !== "top");
    shown = structuredClone(S);
  }

  /* ---------- Moment pieces ---------- */
  const IMPACT = sprite(MAP.spark, { Y:"#ffd23a", W:"#fff" }, 16);
  const BALL_BIG = sprite(MAP.ball, { W:"#f4f4ff", R:"#ff3b5c", S:"#b8bde8" }, 6);
  function slashes(el){
    if (RM) return;
    [22, 46, 70].forEach((top, i) => {
      const s = document.createElement("i"); s.className = "slash"; s.style.top = top + "%";
      el.appendChild(s);
      s.animate([{ clipPath:"inset(0 100% 0 0)", opacity:1 }, { clipPath:"inset(0 0 0 0)", opacity:1, offset:.45 }, { clipPath:"inset(0 0 0 100%)", opacity:1 }],
        { duration:320, delay:i*80, easing:"steps(5)", fill:"both" });
      later(320 + i*80 + 40, () => s.remove());
    });
  }
  function launchBall(){
    const r = rectOf(batw), x0 = r.x + 40, y0 = r.y + 30, dir = onLeft() ? 1 : -1;
    const dx = dir * 900, dy = onTop() ? -330 : -560;
    const b = spawn(BALL_BIG, "", x0, y0, 1100);
    if (RM) return;
    b.animate([
      { transform:"translate(-50%,-50%) scale(1.6)" },
      { transform:`translate(calc(-50% + ${dx*.45}px),calc(-50% + ${dy*.75 - 60}px)) scale(.9)`, offset:.45 },
      { transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.25)`, opacity:1 }
    ], { duration:950, easing:"steps(16)", fill:"forwards" });
    for (let i=1;i<=5;i++) later(i*130, () => sparkles(x0 + dx*.45*i/5*1.3, y0 + (dy*.75-60)*i/5*1.1, 1, 12, true));
  }
  function burstsAround(n, colors, spreadStage){
    const B = rectOf(cl), dir = onLeft() ? 1 : -1;
    for (let i=0;i<n;i++){
      later(i * 170, () => {
        let x, y;
        if (spreadStage && i >= 3){ x = 260 + Math.random()*1400; y = 110 + Math.random()*320; }
        else {
          x = (onLeft() ? B.x + B.w : B.x) + dir*(150 + (i % 3)*170 + Math.random()*80);
          y = B.y + 40 + ((i * 97) % Math.max(60, B.h - 40));
        }
        const fx0 = Math.max(80, Math.min(1840, x)), fy0 = Math.max(80, Math.min(1000, y));
        firework(fx0, fy0, colors, 24, spreadStage ? 190 : 160);
        later(90, () => firework(fx0, fy0, ["#fff", colors[0]], 12, spreadStage ? 90 : 70));
      });
    }
  }
  let wipeEl = null, halfT = null;
  function wipe(){
    wipeEl?.remove();
    if (RM) return;
    const w = document.createElement("div"); w.className = "wipe"; cl.appendChild(w); wipeEl = w;
    const S = 26, cols = 28, rows = 11, cx = 364, cy = 135, maxD = Math.hypot(cx, cy);
    for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){
      const b = document.createElement("i");
      if ((r + c) % 2) b.className = "w";
      b.style.left = c*S + "px"; b.style.top = r*S + "px";
      w.appendChild(b);
      const x = c*S + 13 - cx, y = r*S + 13 - cy;
      const a = (Math.atan2(y, x) + Math.PI) / (Math.PI*2), d = Math.hypot(x, y) / maxD;
      const dIn = (1 - d)*260 + a*190;             // swirl in from the rim
      b.animate([{ transform:"scale(0)" }, { transform:"scale(1)" }], { duration:90, delay:dIn, easing:"steps(2)", fill:"forwards" });
      b.animate([{ transform:"scale(1)" }, { transform:"scale(0)" }], { duration:90, delay:640 + Math.random()*320, easing:"steps(2)", fill:"forwards" });
    }
    later(1150, () => w.remove());
  }
  const wobble = (el, amp = 6, ms = 700) => !RM && el.animate(
    [0, amp, -amp, amp*.8, -amp*.8, amp*.5, -amp*.5, 0].map((x, i) => ({ transform:`translateX(${x}px) rotate(${i % 2 ? .6 : -.6}deg)` })),
    { duration:ms, easing:"steps(1)" });

  BugKit.start({
    name: "Battle Mode",
    hrDelay: 2300,
    place(p){ pos = p; },
    render(S, prev, first){
      latest = S;
      if (first) { paint(S, true); return; }
      if (deferPaint) return;      // the half-inning wipe paints once the screen is covered
      paint(S, false);
    },
    fx: {
      ball(){},
      strike(){ shake(batw, 4, 220); },
      foul(){ const r = rectOf(batw); dmg("FOUL", r.x + r.w/2, r.y + 6, "sm", 1150); },
      hit({ bases = 1, batter }, S){
        const word = ["", "SINGLE", "DOUBLE", "TRIPLE"][bases] || "HIT";
        say([{ t:`${surname(batter || S.batter || "Batter")} used ${word}!` }], { hold:1300 });
        flashWins([batw]);
        hopDelay = hop(Math.min(3, bases), S[battingTeam(S)].color);
      },
      walk({ batter }, S){
        const p = surname(S.pitcher || "The pitcher");
        say([{ t:`${p}'s control wavers...`, hold:600 }, `${surname(batter || S.batter || "Batter")} takes 1st.`], { hold:1200 });
        wobble(pitw, 5, 900);
        hopDelay = hop(1, S[battingTeam(S)].color, true);
      },
      error(o, S){
        say([{ t:"The fielder fumbled! (E)", cls:"red" }], { hold:1400 });
        wobble(cl, 7, 800);
        hopDelay = hop(1, S[battingTeam(S)].color);
      },
      out({ batter }, S){
        say([`${surname(batter || S.batter || "Batter")} is out.`], { hold:1100 });
        shake(batw, 6, 320);
      },
      k({ looking, batter } = {}, S){
        const who = surname(batter || S.batter || "Batter"), pit = surname(S.pitcher || "The pitcher");
        slashes(batw); flashWins([batw]);
        later(300, () => { restart(batw, "blink"); shake(batw, 8, 420); });
        const B = rectOf(cl), x = onLeft() ? B.x + B.w + 44 : B.x - 44 - 150, y = onTop() ? B.y : B.y + B.h - 210;
        const k = spawn(`<div class="spr">${looking ? SPR.kIce : SPR.kRed}</div><div class="lbl">${looking ? "LOOKING" : "SWINGING"}</div>`,
          "ksp" + (looking ? " look" : ""), x, y, 3000);
        k.style.width = "150px";
        later(140, () => { firework(x + 75, y + 70, looking ? ["#8ee8ff", "#fff", "#2479b8"] : ["#ff3b5c", "#fff", "#ffd23a"], 20, 120); shake(bug, 6, 300); });
        later(200, () => sparkles(x + 75, y + 80, 6, 100, looking));
        if (looking && !RM) for (let i=0;i<14;i++){
          const f = document.createElement("i"); f.className = "frost";
          f.style.left = (Math.random()*170 - 10) + "px"; f.style.top = (Math.random()*60) + "px";
          k.appendChild(f);
          f.animate([{ transform:"translateY(0)", opacity:1 }, { transform:`translateY(${120 + Math.random()*80}px)`, opacity:0 }],
            { duration:1600, delay:300 + i*90, easing:"steps(10)", fill:"both" });
        }
        say([{ t:`${pit} used STRIKEOUT!`, hold:700 }, looking ? { t:`${who} was frozen!`, cls:"ice" } : { t:`${who} is out!` }], { hold:1300 });
      },
      hr({ runs = 1, batter }, S){
        const who = surname(batter || S.batter || "Batter");
        flashStage(); shake(bug, 12, 640);
        flashWins($$(".cluster > .win, .duo .win"));
        launchBall();
        if (runs >= 4 && !RM) later(250, () => cl.animate([{ filter:"hue-rotate(0deg)" }, { filter:"hue-rotate(360deg)" }], { duration:1200, easing:"steps(8)", iterations:2 }));
        say([{ t:`${who} used HOME RUN!`, hold:520 }, { t:"CRITICAL HIT!", cls:"gold", flash:true, hold:1400 }]);
        later(RM ? 0 : 1200, () => { const r = rectOf(batw); spawn(IMPACT, "spk big", r.x + r.w/2, r.y + r.h/2, 800); shake(bug, 8, 360); });
      },
      run({ team, runs = 1, hr }, S){
        team ||= battingTeam(S);
        const el = val(team, "r"), r = rectOf(el), cx = r.x + r.w/2 - 8, cy = onTop() ? r.y + 48 : r.y + 4;
        if (hr){
          const slam = runs >= 4, col = S[team].color;
          dmg(`+${runs}`, cx, cy, slam ? "big" : "", 2000);
          flashWins([$(".party")]);
          burstsAround(slam ? 9 : 2 + runs, ["#ffd23a", "#fff3a8", "#f4f4ff", col, "#ff9a2a"], slam);
          const abbr = (S[team].abbr || "").toUpperCase();
          say(slam
            ? [{ t:"GRAND SLAM!!", cls:"gold", flash:true, hold:650 }, `${abbr} gain 4 runs!`]
            : [`${abbr} gain ${runs} run${runs > 1 ? "s" : ""}!`], { hold:1400 });
        } else {
          dmg(`+${runs}`, cx, cy, "heal", 1900);
          sparkles(cx, cy + 20, 5, 50);
        }
      },
      half({ inning, half }, S){
        const from = shown || S, label = (h) => h === "top" ? "TOP" : "BOTTOM";
        wipe(); deferPaint = true; clearTimeout(halfT);
        halfT = later(RM ? 0 : 560, () => { deferPaint = false; if (latest) paint(latest, false); });
        later(RM ? 40 : 700, () => say([
          { t:`${label(from.half)} ${from.inning} {>} ${label(half ?? S.half)} ${inning ?? S.inning}`, hold:700 },
          `${(S[battingTeam(S)].abbr || "").toUpperCase()}'s turn to bat!`
        ], { hold:1300 }));
      },
      reset(){
        closeDlg(); fx.innerHTML = ""; wipeEl?.remove(); clearTimeout(halfT); deferPaint = false; shown = null;
      }
    }
  });
})();
</script>
</body>
</html>
