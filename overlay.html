<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920, initial-scale=1" />
  <title>Scoreboard Overlay</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- Warm the connections + module graph early: the bug paints sooner in OBS. -->
  <link rel="preconnect" href="https://yeykyutsbeqjcgdxlucn.supabase.co" crossorigin />
  <link rel="preconnect" href="https://esm.sh" crossorigin />
  <link rel="modulepreload" href="https://esm.sh/@supabase/supabase-js@2" />
  <link rel="modulepreload" href="/js/supabase.js" />
  <link rel="modulepreload" href="/js/config.js" />
  <link rel="modulepreload" href="/js/logic.js" />
  <link rel="modulepreload" href="/js/anim.js" />
  <link rel="modulepreload" href="/js/audio.js" />
  <link rel="stylesheet" href="/css/overlay.css" />
  <link rel="stylesheet" href="/css/themes.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/cards.css" />
  <link rel="stylesheet" href="/css/anim.css" />
</head>
<body>
  <!-- Display-only. Transparent background for OBS Browser Source. -->
  <div id="bug-wrap">
    <div id="reveal"></div>
    <div id="bug" class="bug" data-ready="0">
      <div class="team away">
        <img class="logo" id="away-logo" alt="" decoding="async" hidden />
        <span class="abbr" id="away-abbr">VIS</span>
        <span class="runs" id="away-runs">0</span>
        <span class="rhe" aria-hidden="true"><span class="he"><i>H</i><b id="away-h">0</b></span><span class="he"><i>E</i><b id="away-e">0</b></span></span>
      </div>
      <div class="team home">
        <img class="logo" id="home-logo" alt="" decoding="async" hidden />
        <span class="abbr" id="home-abbr">HOME</span>
        <span class="runs" id="home-runs">0</span>
        <span class="rhe" aria-hidden="true"><span class="he"><i>H</i><b id="home-h">0</b></span><span class="he"><i>E</i><b id="home-e">0</b></span></span>
      </div>
      <div class="situation sit-baseball">
        <span class="inning" id="inning">▲1</span>
        <svg class="diamond" viewBox="0 0 48 48" aria-hidden="true">
          <g class="base" id="b2"><rect x="19" y="3" width="10" height="10" transform="rotate(45 24 8)"/></g>
          <g class="base" id="b3"><rect x="3" y="19" width="10" height="10" transform="rotate(45 8 24)"/></g>
          <g class="base" id="b1"><rect x="35" y="19" width="10" height="10" transform="rotate(45 40 24)"/></g>
        </svg>
        <span class="count"><b id="balls">0</b><em>-</em><b id="strikes">0</b></span>
        <span class="outs" id="outs"><i class="dot"></i><i class="dot"></i><i class="dot"></i></span>
        <span class="bso">
          <span class="bso-row"><em>B</em><span id="bso-b" class="dots"><i class="d"></i><i class="d"></i><i class="d"></i></span></span>
          <span class="bso-row"><em>S</em><span id="bso-s" class="dots"><i class="d"></i><i class="d"></i></span></span>
          <span class="bso-row"><em>O</em><span id="bso-o" class="dots"><i class="d"></i><i class="d"></i></span></span>
        </span>
        <span class="clock js-clock" id="clock" hidden>--:--</span>
      </div>
      <div class="situation sit-football" hidden>
        <span class="fb-q" id="fb-quarter">Q1</span>
        <span class="clock js-clock" id="fb-clock" hidden>12:00</span>
        <span class="fb-dd" id="fb-dd">1ST &amp; 10</span>
        <span class="fb-poss" id="fb-poss"></span>
      </div>
      <div class="situation sit-soccer" hidden>
        <span class="fb-q" id="sc-half">1st</span>
        <span class="clock js-clock" id="sc-clock">0:00</span>
        <span class="fb-dd" id="sc-stoppage"></span>
      </div>
    </div>
    <div class="detail" id="detail" hidden></div>
  </div>
  <div id="card" hidden></div>
  <div id="fx"></div>
  <button id="sound-hint" hidden>🔊 Click to enable sound</button>
  <script type="module" src="/js/overlay.js"></script>
</body>
</html>
