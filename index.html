<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1018" />
  <title>Scoreboard</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- Standalone page, no build: the control panel's tokens, inlined. Keep the
       two in step — tapping through to a different shade of dark reads as a bug. -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1018; color: #f2f6fc; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
    .box { text-align: center; padding: 24px; }
    h1 { font-size: clamp(28px, 8vw, 44px); margin: 0 0 6px; letter-spacing: -0.01em; }
    a { display: inline-block; margin: 14px 8px 8px; padding: 19px 26px; border-radius: 16px; background: #2f63cc; color: #fff; text-decoration: none; font-size: 18px; font-weight: 800; }
    p { color: #9aa8c2; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Broadcast Scoreboard</h1>
    <p>Live, phone-controlled scorebug overlays for OBS.</p>
    <a href="/control">Open Control Panel</a>
  </div>
</body>
</html>
