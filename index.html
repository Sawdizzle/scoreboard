<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scoreboard</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e1421; color: #eef2f8; font-family: system-ui, sans-serif; }
    .box { text-align: center; }
    a { display: inline-block; margin: 8px; padding: 14px 22px; border-radius: 12px; background: #5b8fd0; color: #fff; text-decoration: none; font-weight: 700; }
    a.ghost { background: transparent; border: 1px solid #2a3550; color: #eef2f8; }
    p { color: #8a97b2; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Broadcast Scoreboard</h1>
    <p>Live, phone-controlled scorebug overlays for OBS.</p>
    <a href="/control">Open Control Panel</a>
    <a class="ghost" href="/overlay?debug=1">Preview Overlay</a>
  </div>
</body>
</html>
