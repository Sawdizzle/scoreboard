<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="10%" r="95%"><stop offset="0" stop-color="#22355c"/><stop offset=".55" stop-color="#0e1729"/><stop offset="1" stop-color="#060a13"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6dc" stop-opacity=".55"/><stop offset="1" stop-color="#fff6dc" stop-opacity="0"/></linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2740"/><stop offset="1" stop-color="#070b14"/></linearGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#eef2f7"/><stop offset="1" stop-color="#b9c3d1"/></radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  
    <!-- light from the top -->
    <path d="M150 -20 L230 -20 L330 300 L40 300 Z" fill="url(#beam)" opacity=".32"/>
    <path d="M282 -20 L362 -20 L472 300 L182 300 Z" fill="url(#beam)" opacity=".2"/>
    <g transform="translate(0 0) scale(1)">
      <!-- the board -->
      <rect x="44" y="168" width="424" height="262" rx="40" fill="url(#plate)" stroke="#f2b632" stroke-width="12"/>
      <rect x="62" y="186" width="388" height="226" rx="28" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="3"/>
      <rect x="252" y="214" width="8" height="170" rx="4" fill="rgba(255,255,255,.12)"/>
      <!-- the scores, lit -->
      <g filter="url(#glow)">
        <rect x="120" y="214" width="78" height="26" rx="13" fill="rgba(255,207,58,.08)"/><rect x="120" y="358" width="78" height="26" rx="13" fill="rgba(255,207,58,.08)"/><rect x="120" y="286" width="78" height="26" rx="13" fill="#ffcf3a"/><rect x="104" y="230" width="26" height="56" rx="13" fill="#ffcf3a"/><rect x="188" y="230" width="26" height="56" rx="13" fill="#ffcf3a"/><rect x="104" y="302" width="26" height="66" rx="13" fill="rgba(255,207,58,.08)"/><rect x="188" y="302" width="26" height="66" rx="13" fill="#ffcf3a"/>
        <rect x="314" y="214" width="78" height="26" rx="13" fill="#ffcf3a"/><rect x="314" y="358" width="78" height="26" rx="13" fill="#ffcf3a"/><rect x="314" y="286" width="78" height="26" rx="13" fill="#ffcf3a"/><rect x="298" y="230" width="26" height="56" rx="13" fill="rgba(255,207,58,.08)"/><rect x="382" y="230" width="26" height="56" rx="13" fill="#ffcf3a"/><rect x="298" y="302" width="26" height="66" rx="13" fill="#ffcf3a"/><rect x="382" y="302" width="26" height="66" rx="13" fill="rgba(255,207,58,.08)"/>
      </g>
      <!-- the ball over the corner -->
      <g filter="url(#shadow)" transform="translate(14 -20) scale(.94)" transform-origin="404 146">
        <circle cx="404" cy="146" r="86" fill="url(#ball)"/>
        <path d="M352 78 Q392 146 352 214" fill="none" stroke="#d63c33" stroke-width="9" stroke-linecap="round"/>
        <path d="M456 78 Q416 146 456 214" fill="none" stroke="#d63c33" stroke-width="9" stroke-linecap="round"/>
        <path d="M354.808 96.48 L372.808 104.48" stroke="#d63c33" stroke-width="5" stroke-linecap="round"/><path d="M453.192 96.48 L435.192 104.48" stroke="#d63c33" stroke-width="5" stroke-linecap="round"/><path d="M360.952 118.24 L378.952 126.24" stroke="#d63c33" stroke-width="5" stroke-linecap="round"/><path d="M447.048 118.24 L429.048 126.24" stroke="#d63c33" stroke-width="5" stroke-linecap="round"/><path d="M363 140 L381 148" stroke="#d63c33" stroke-width="5" stroke-linecap="round"/><path d="M445 140 L427 148" stroke="#d63c33" stroke-width="5" stroke-linecap="round"/><path d="M360.952 161.76 L378.952 169.76" stroke="#d63c33" stroke-width="5" stroke-linecap="round"/><path d="M447.048 161.76 L429.048 169.76" stroke="#d63c33" stroke-width="5" stroke-linecap="round"/><path d="M354.808 183.52 L372.808 191.52" stroke="#d63c33" stroke-width="5" stroke-linecap="round"/><path d="M453.192 183.52 L435.192 191.52" stroke="#d63c33" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>
</svg>