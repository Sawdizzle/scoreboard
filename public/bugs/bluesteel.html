<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scoreboard Theme: Blue Steel</title>
<link rel="preload" href="../fonts/anton-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/martian-mono-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="img/bluesteel-under.webp" as="image">
<link rel="preload" href="img/bluesteel-feathers.webp" as="image">
<link rel="preload" href="img/bluesteel-skull.webp" as="image">
<link rel="preload" href="img/bluesteel-logo.webp" as="image">
<style>
/* Self-hosted fonts (latin subset), so nothing reaches a font CDN on air. */
@font-face{font-family:'Anton';font-weight:400;font-display:swap;src:url('../fonts/anton-400.woff2') format('woff2')}
@font-face{font-family:'Martian Mono';font-weight:100 800;font-display:swap;src:url('../fonts/martian-mono-var.woff2') format('woff2')}
</style>
<style>
/* ============================================================
   BLUE STEEL — the club's own bug, and it moves.
   Blue steel is steel that has been heated and let cool until it
   turns blue, so every big moment here is forged: a run heats its
   score white-hot and it cools through clay to steel blue, a home
   run is a plate stamped onto the screen letter by letter with
   sparks off every strike, and a strikeout is cut with a blade.
   The crest is the club's skull, split into layers so the feathers
   move on their own and the eye can burn. Night-field navy, chalk,
   ice steel and infield clay, chamfered corners, Anton and Martian
   Mono, as in the Blue Steel theme and on the club's own board.
   Sparks and embers are one canvas that only runs while something
   is flying; the idle loops (feathers, the eye) are transform and
   opacity only.
   ============================================================ */
:root{
  --navy:#0c121d; --navy-hi:#17223a; --navy-lo:#070b12; --well:#04070d; --edge:#03060b;
  --ink:#f2f0e9; --steel:#7fc0ef; --steel-hi:#bfe3fb; --steel-lo:#3d6e96;
  --clay:#e0794a; --clay-hi:#ffb07a; --dim:#8596ac; --line:rgba(242,240,233,.14);
  --red:#e0524a; --green:#5fcf8a;
  --bevel:linear-gradient(180deg,#a9c2d8 0%,#57728d 30%,#1d3048 58%,#35506c 80%,#8aa5bf 100%);
  --disp:"Anton","Arial Black",Impact,sans-serif;
  --mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.7,0,.84,0); --slam:cubic-bezier(.55,0,.9,.35);
  --logo:url(img/bluesteel-logo.webp);
}
body{--demo-accent:var(--steel)}
body.preview{background:
  radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.06),transparent 55%),
  linear-gradient(160deg,#2f5a34 0%,#23452a 38%,#6b4f35 70%,#3d2c1e 100%)}
#stage{font-family:var(--disp);color:var(--ink);-webkit-font-smoothing:antialiased;font-synthesis:none}
#fx{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;z-index:20}

/* ---------- The crest: the club skull in three layers ----------
   under = a dark ink silhouette, feathers = the headdress (swaying about the
   concho), skull = everything else on top. The feathers sway on `rotate` and
   gust on `transform`, so the two stack. */
.lg{position:absolute;inset:0}
.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.lg .u{filter:drop-shadow(0 5px 8px rgba(0,0,0,.6))}
.lg .f{transform-origin:51.4% 39.7%;animation:sway 6.4s ease-in-out infinite}
@keyframes sway{0%,100%{rotate:-1.2deg}50%{rotate:1.5deg}}
.lg.gust .f{animation:sway 6.4s ease-in-out infinite,gust 1.7s var(--ease-out)}
@keyframes gust{0%{transform:none}18%{transform:rotate(-6deg)}42%{transform:rotate(3.5deg)}66%{transform:rotate(-1.6deg)}100%{transform:none}}
/* the eye: a cold light deep in the socket, breathing; it flares on big moments */
.lg .eye{position:absolute;left:34.5%;top:56.9%;width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;pointer-events:none;opacity:.24;
  background:radial-gradient(circle,rgba(236,248,255,.95) 0,rgba(127,192,239,.62) 15%,rgba(127,192,239,.18) 36%,transparent 62%);
  animation:eye 4.6s ease-in-out infinite}
@keyframes eye{0%,100%{opacity:.2}50%{opacity:.52}}
.lg .strk{position:absolute;left:34.5%;top:56.9%;width:150%;height:3%;margin:-1.5% 0 0 -75%;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,rgba(236,248,255,.95) 0,rgba(127,192,239,.5) 30%,transparent 70%)}
.lg.flare .eye{animation:eyeFlare 1.5s ease-out,eye 4.6s 1.5s ease-in-out infinite}
@keyframes eyeFlare{0%{opacity:.3;transform:scale(1)}14%{opacity:1;transform:scale(2.1)}100%{opacity:.3;transform:scale(1)}}
.lg.flare .strk{animation:streak 1.2s ease-out}
@keyframes streak{0%{opacity:0;transform:scaleX(.15)}16%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1.25)}}
body.rally .lg .eye{animation:eyeBurn 1.1s ease-in-out infinite}
body.rally .lg.flare .eye{animation:eyeFlare 1.5s ease-out,eyeBurn 1.1s 1.5s ease-in-out infinite}
@keyframes eyeBurn{0%,100%{opacity:.62;transform:scale(1.15)}50%{opacity:1;transform:scale(1.55)}}
/* a steel sheen clipped to the logo's own shape */
.lg .sh{position:absolute;inset:0;pointer-events:none;overflow:hidden;
  -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.lg .sh::before{content:"";position:absolute;top:-10%;bottom:-10%;left:-70%;width:55%;
  background:linear-gradient(100deg,transparent,rgba(225,242,255,.8) 50%,transparent)}
.lg.shine .sh::before{animation:shine 1.4s var(--ease-out)}
@keyframes shine{from{transform:translateX(0)}to{transform:translateX(400%)}}

/* ---------- Bug: crest, then the plate with its strip ---------- */
#bug.await{visibility:hidden}
.pkg{display:flex;align-items:center}
body[data-pos$="r"] .pkg{flex-direction:row-reverse}
.crest{position:relative;z-index:2;width:126px;height:131px;margin-right:-24px;flex:0 0 auto}
body[data-pos$="r"] .crest{margin:0 0 0 -24px}
.main{position:relative}
.stack{display:flex;flex-direction:column;align-items:stretch;filter:drop-shadow(0 12px 22px rgba(0,0,0,.5))}
body[data-pos^="b"] .stack{flex-direction:column-reverse}

/* the plate: a bevelled steel edge, chamfered, round a navy panel */
.plate{position:relative;height:74px;padding:2px;background:var(--bevel);
  clip-path:polygon(15px 0,100% 0,100% calc(100% - 15px),calc(100% - 15px) 100%,0 100%,0 15px)}
.rail{position:relative;display:flex;align-items:stretch;height:100%;padding:4px 6px 4px 30px;overflow:hidden;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,var(--navy-hi) 0%,#0e1627 48%,var(--navy-lo) 100%);
  box-shadow:inset 0 1px 0 rgba(191,227,251,.18),inset 0 -8px 16px rgba(0,0,0,.35);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
body[data-pos$="r"] .rail{padding:4px 30px 4px 6px}
/* a cold specular that crosses the plate now and then, and on big moments */
.rail::after{content:"";position:absolute;inset:0;pointer-events:none;transform:translateX(-110%);
  background:linear-gradient(105deg,transparent 38%,rgba(191,227,251,.2) 47%,rgba(236,248,255,.34) 50%,rgba(191,227,251,.2) 53%,transparent 62%)}
.rail.spec::after{animation:spec 1.3s var(--ease-out)}
@keyframes spec{to{transform:translateX(110%)}}
/* rally mode: the steel edge runs hot-cold */
.plate::before{content:"";position:absolute;inset:0;opacity:0;background:linear-gradient(180deg,#eef8ff,var(--steel) 50%,#eef8ff)}
body.rally .plate::before{animation:rallyEdge 1.4s ease-in-out infinite}
@keyframes rallyEdge{0%,100%{opacity:0}50%{opacity:.95}}

/* team block: a team-colour tab, the abbreviation, then the boxed score */
.team{position:relative;display:flex;align-items:stretch}
.team + .team{box-shadow:-1px 0 0 var(--line)}
.slab{position:relative;display:flex;align-items:center;justify-content:center;min-width:118px;padding:0 14px 0 26px}
.slab::before{content:"";position:absolute;left:10px;top:13px;bottom:13px;width:7px;background:var(--tc);transform:skewX(-14deg);
  box-shadow:0 0 0 1px rgba(242,240,233,.4)}
.ab{font-family:var(--disp);font-size:31px;letter-spacing:.05em;line-height:1;text-transform:uppercase;color:var(--ink);
  text-shadow:0 2px 0 var(--edge);white-space:nowrap}
.score{position:relative;display:flex;align-items:center;justify-content:center;width:70px;margin:3px 2px;border-radius:4px;
  background:rgba(4,7,13,.78);border:1px solid var(--line);box-shadow:inset 0 2px 8px rgba(0,0,0,.75)}
.score .roll{font-family:var(--mono);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
/* batting marker: an ice bar along the foot of the batting team, with a chevron */
.team::after{content:"";position:absolute;left:12px;right:8px;bottom:0;height:3px;background:linear-gradient(90deg,var(--steel-lo),var(--steel-hi));
  box-shadow:0 0 10px rgba(127,192,239,.8);transform:scaleX(0);transform-origin:0 50%;transition:transform .5s var(--ease-out)}
.team.bat::after{transform:scaleX(1)}
/* a run: the score is struck white-hot and cools to blue steel */
.team.temper .score{animation:wellHeat 2.6s ease-out}
@keyframes wellHeat{0%{background:rgba(255,150,80,.5);border-color:rgba(255,200,150,.9);box-shadow:inset 0 0 18px rgba(255,190,120,.9),0 0 22px rgba(224,121,74,.8)}
  35%{background:rgba(224,121,74,.22);border-color:rgba(224,121,74,.7);box-shadow:inset 0 0 14px rgba(224,121,74,.6),0 0 12px rgba(224,121,74,.4)}
  70%{background:rgba(61,110,150,.25);border-color:rgba(127,192,239,.6);box-shadow:inset 0 0 12px rgba(127,192,239,.45),0 0 10px rgba(127,192,239,.35)}
  100%{}}
.team.temper .score .roll{animation:temper 2.6s linear}
@keyframes temper{0%{color:#fffbef;text-shadow:0 0 4px #fff,0 0 14px #ffc27a,0 0 26px #e0794a}
  18%{color:#ffd9a6;text-shadow:0 0 10px #ffa060,0 0 24px rgba(224,121,74,.8)}
  40%{color:#ef9160;text-shadow:0 0 10px rgba(224,121,74,.6)}
  68%{color:#8cc8f2;text-shadow:0 0 12px rgba(127,192,239,.7)}}
.team.stamp .score .roll{animation:temper 2.6s linear,stampNum .42s var(--ease-out)}
@keyframes stampNum{0%{scale:1.45}100%{scale:1}}
/* walk-off: the winners' block pulses ice */
.team.win .slab{animation:winPulse 1.1s ease-in-out 4}
@keyframes winPulse{50%{box-shadow:inset 0 0 0 2px var(--steel-hi),inset 0 0 30px rgba(127,192,239,.45)}}

/* rolling numerals: every value stacks in one grid cell and slides */
.roll{position:relative;display:inline-grid;overflow:hidden;vertical-align:bottom}
.roll > b{grid-area:1/1;font-weight:inherit;text-align:center}

/* ---------- Situation: inning, diamond, and the board's B-S-O rows ---------- */
.sit{display:flex;align-items:center;gap:16px;padding:0 12px 0 16px;border-left:1px solid var(--line)}
.inn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:60px;overflow:hidden;
  border-radius:3px}
.inn .arr{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;opacity:.2;transition:opacity .3s}
.inn .up{border-bottom:8px solid var(--steel)} .inn .dn{border-top:8px solid var(--steel)}
.inn .arr.on{opacity:1;filter:drop-shadow(0 0 4px rgba(127,192,239,.8))}
.inn .n{font-family:var(--mono);font-weight:700;font-size:25px;line-height:1.05;color:var(--ink);margin:3px 0}
/* between halves a steel shutter drops over the inning */
.inn .shut{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transform:translateY(-102%);
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.14) 0 1px,transparent 1px 7px),linear-gradient(180deg,#d4e4f1,#8fa9c1 55%,#6a8299);
  color:var(--navy);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.inn .shut small{font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.12em}
.inn .shut b{font-family:var(--disp);font-weight:400;font-size:30px;line-height:1}
.inn.down .shut{animation:shutDown .5s cubic-bezier(.5,0,.75,0) forwards}
.inn.up .shut{animation:shutUp .45s var(--ease-in) forwards;transform:none}
@keyframes shutDown{0%{transform:translateY(-102%)}78%{transform:translateY(3%)}90%{transform:translateY(-2%)}100%{transform:none}}
@keyframes shutUp{to{transform:translateY(-102%)}}

.dia{width:64px;height:56px;overflow:visible}
.dia .path{fill:none;stroke:rgba(127,192,239,.16);stroke-width:1.4}
.dia .trace{fill:none;stroke:var(--steel-hi);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;
  filter:drop-shadow(0 0 3px rgba(127,192,239,.9))}
.dia .plateH{fill:rgba(242,240,233,.35)}
.dia .b{fill:rgba(4,7,13,.7);stroke:rgba(127,192,239,.5);stroke-width:1.8;transform-box:fill-box;transform-origin:50% 50%;transition:fill .3s,stroke .3s}
.dia .b.on{fill:var(--clay);stroke:#ffd2b8;filter:drop-shadow(0 0 5px rgba(224,121,74,.85))}
.dia .b.pop{animation:basePop .55s var(--ease-out)}
@keyframes basePop{0%{transform:scale(.3)}60%{transform:scale(1.3)}100%{transform:scale(1)}}

.bso{display:grid;grid-template-columns:auto auto;align-items:center;column-gap:7px;row-gap:5px}
.bso em{font-family:var(--mono);font-style:normal;font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--dim);line-height:1}
.bso .dots{display:flex;gap:5px}
.bso i{position:relative;width:12px;height:12px;border-radius:50%;background:rgba(242,240,233,.07);box-shadow:inset 0 0 0 1.5px rgba(242,240,233,.2);
  transition:background .25s,box-shadow .25s}
.bso .b i.on{background:var(--steel);box-shadow:0 0 8px rgba(127,192,239,.8)}
.bso .s i.on,.bso .o i.on{background:var(--clay);box-shadow:0 0 8px rgba(224,121,74,.8)}
.bso i.pop{animation:dotPop .45s var(--ease-out)}
@keyframes dotPop{0%{transform:scale(1.9)}100%{transform:scale(1)}}
.bso i::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--clay-hi);opacity:0}
.bso .b i::after{border-color:var(--steel-hi)}
.bso i.pop::after{animation:ring .6s var(--ease-out)}
@keyframes ring{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(2.6)}}

/* the game's time limit, when it has one and Show clock is on */
.clk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:96px;padding-left:14px;border-left:1px solid var(--line);align-self:stretch}
.clk[hidden]{display:none}
.clk em{font-family:var(--mono);font-style:normal;font-weight:700;font-size:10px;letter-spacing:.16em;color:var(--dim);line-height:1}
.clk b{font-family:var(--mono);font-weight:700;font-size:21px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);transition:color .4s}
.clk.low b{color:var(--clay-hi)}
.clk.zero b{color:var(--red);animation:clkBlink 1s steps(2,jump-none) infinite}
@keyframes clkBlink{50%{opacity:.25}}
.clk.show{animation:clkIn .5s var(--ease-out)}
@keyframes clkIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.clk.hit{animation:clkHit 1.2s ease-out}
@keyframes clkHit{0%,30%{background:rgba(224,82,74,.35)}100%{background:transparent}}

/* ---------- Strip: the at-bat, play tags, and the club line ---------- */
.strip{position:relative;height:34px;margin:0 12px 0 32px;overflow:hidden;
  background:linear-gradient(180deg,#0d1422,#070b12);box-shadow:inset 0 1px 0 rgba(127,192,239,.18),inset 0 0 0 1px rgba(127,192,239,.14);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px))}
body[data-pos^="b"] .strip{clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%,0 10px)}
body[data-pos$="r"] .strip{margin:0 32px 0 12px}
.line{position:absolute;inset:0;display:flex;align-items:center;gap:11px;padding:0 16px;white-space:nowrap}
.line .tag{flex:0 0 auto;padding:4px 7px 3px;border-radius:2px;font-family:var(--mono);font-weight:800;font-size:12px;letter-spacing:.08em;line-height:1;
  background:rgba(127,192,239,.14);color:var(--steel-hi)}
.line .tag.hot{background:var(--clay);color:#1a0b04}
.line .tag.ice{background:var(--steel);color:var(--navy)}
.line .tag.red{background:var(--red);color:#fff}
.line .tag.green{background:var(--green);color:#06210f}
.line .txt{font-family:var(--disp);font-size:20px;letter-spacing:.05em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.line .side{margin-left:auto;font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
.line .side b{color:var(--ink);font-weight:800;margin-left:6px}
.line.in{animation:lineIn .42s .14s var(--ease-out) both}
.line.out{animation:lineOut .3s var(--ease-in) both}
@keyframes lineIn{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
@keyframes lineOut{from{transform:none;opacity:1}to{transform:translateY(-100%);opacity:0}}
.line.club{background:linear-gradient(90deg,rgba(127,192,239,.16),transparent 75%)}
.line.club .ico{flex:0 0 auto;width:26px;height:27px;background:var(--logo) center/contain no-repeat}
.line.club .txt{color:var(--steel-hi);letter-spacing:.14em}
.line.club .side{color:var(--steel)}

/* ---------- Strikeout: a blade cuts a steel flag out of the side ---------- */
.kw{position:absolute;top:0;left:calc(100% + 12px);height:74px;visibility:hidden;white-space:nowrap}
body[data-pos^="b"] .kw{top:auto;bottom:0}
body[data-pos$="r"] .kw{left:auto;right:calc(100% + 12px)}
.kw.play{visibility:visible}
.kflag{height:100%;padding:2px;background:var(--bevel)}
.kflag .kin{display:flex;align-items:stretch;height:100%;padding:4px 30px 4px 4px;
  background:linear-gradient(180deg,var(--navy-hi),var(--navy-lo));box-shadow:inset 0 1px 0 rgba(191,227,251,.18)}
body[data-pos$="r"] .kflag .kin{flex-direction:row-reverse;padding:4px 4px 4px 30px}
.kflag .k{display:flex;align-items:center;justify-content:center;width:64px;
  background:linear-gradient(180deg,var(--steel-hi),var(--steel) 55%,var(--steel-lo));font-family:var(--disp);font-size:54px;line-height:1;color:var(--navy);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.kw.looking .k span{display:inline-block;transform:scaleX(-1)}
.kflag .kt{display:flex;flex-direction:column;justify-content:center;padding:0 4px 0 16px;gap:7px}
body[data-pos$="r"] .kflag .kt{padding:0 16px 0 4px;align-items:flex-end}
.kflag .kt b{font-family:var(--disp);font-weight:400;font-size:27px;line-height:1;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.kflag .kt small{font-family:var(--mono);font-weight:600;font-size:13px;line-height:1;letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
.kflag .kt small em{font-style:normal;font-weight:800;color:var(--steel-hi)}
/* the blade: a white-hot line that runs ahead of the cut */
.kw .blade{position:absolute;top:-14px;bottom:-14px;left:0;width:3px;background:linear-gradient(180deg,transparent,#fff 30%,var(--steel-hi) 70%,transparent);
  box-shadow:0 0 12px 2px rgba(191,227,251,.9);transform:skewX(-28deg);opacity:0}
.kw.play .kflag{animation:cutIn 3.5s linear forwards}
.kw.play .blade{animation:blade .5s var(--ease-out) forwards}
body[data-pos$="r"] .kw.play .kflag{animation-name:cutInR}
body[data-pos$="r"] .kw.play .blade{animation-name:bladeR}
@keyframes cutIn{0%{clip-path:polygon(0 0,0 0,-44px 100%,0 100%);animation-timing-function:cubic-bezier(.16,1,.3,1)}
  14%{clip-path:polygon(0 0,calc(100% + 44px) 0,100% 100%,0 100%)}
  86%{clip-path:polygon(0 0,calc(100% + 44px) 0,100% 100%,0 100%);animation-timing-function:cubic-bezier(.7,0,.84,0)}
  100%{clip-path:polygon(calc(100% + 44px) 0,calc(100% + 44px) 0,100% 100%,100% 100%)}}
@keyframes cutInR{0%{clip-path:polygon(100% 0,100% 0,100% 100%,calc(100% + 44px) 100%);animation-timing-function:cubic-bezier(.16,1,.3,1)}
  14%{clip-path:polygon(-44px 0,100% 0,100% 100%,0 100%)}
  86%{clip-path:polygon(-44px 0,100% 0,100% 100%,0 100%);animation-timing-function:cubic-bezier(.7,0,.84,0)}
  100%{clip-path:polygon(-44px 0,-44px 0,0 100%,0 100%)}}
@keyframes blade{0%{left:0;opacity:1}85%{opacity:1}100%{left:100%;opacity:0}}
@keyframes bladeR{0%{left:100%;opacity:1}85%{opacity:1}100%{left:0;opacity:0}}
.kw.play .k span{display:inline-block;animation:kSlam .45s .18s var(--ease-out) both}
.kw.play.looking .k span{animation-name:kSlamL}
@keyframes kSlam{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes kSlamL{from{transform:scaleX(-1) scale(2.4);opacity:0}to{transform:scaleX(-1) scale(1);opacity:1}}
.kw.play .kt > *{animation:riseFlat .45s .3s var(--ease-out) both}
.kw.play .kt small{animation-delay:.42s}

/* ---------- Home run: a steel plate stamped onto the screen ---------- */
.hrw{position:absolute;left:-60px;bottom:calc(100% + 22px);width:880px;height:150px;pointer-events:none;visibility:hidden}
body[data-pos^="t"] .hrw{bottom:auto;top:calc(100% + 22px)}
body[data-pos$="r"] .hrw{left:auto;right:-60px}
body[data-pos$="r"] .hr{left:auto;right:0}
.hrw.play{visibility:visible}
.hr{position:absolute;left:0;top:0;bottom:0;min-width:640px;padding:3px;background:var(--bevel);
  clip-path:polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px)}
.hr .hin{position:relative;display:flex;align-items:center;gap:18px;height:100%;padding:0 70px 0 150px;overflow:hidden;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px),
    radial-gradient(ellipse 60% 90% at 12% 50%,rgba(127,192,239,.2),transparent 70%),
    linear-gradient(180deg,var(--navy-hi),#0d1526 50%,var(--navy-lo));
  box-shadow:inset 0 1px 0 rgba(191,227,251,.2);
  clip-path:polygon(20px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%,0 20px)}
.hr .hcrest{position:absolute;left:8px;top:50%;width:132px;height:137px;margin-top:-68px}
.hr .hbody{display:flex;flex-direction:column;justify-content:center;gap:8px;flex:1;min-width:0}
.hr .t1{display:flex;line-height:.9;padding-top:6px;white-space:nowrap}
.hr .t1 .ch{display:inline-block;font-size:82px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink);text-shadow:0 4px 0 var(--edge)}
.hr .t1 .sp{display:inline-block;width:.28em;font-size:82px}
.hr .t2{overflow:hidden;display:flex;align-items:center;gap:14px;white-space:nowrap}
.hr .t2 i{width:12px;height:22px;background:var(--tc);transform:skewX(-14deg);box-shadow:0 0 0 1px rgba(242,240,233,.5);flex:0 0 auto}
.hr .t2 b{font-family:var(--disp);font-weight:400;font-size:30px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.hr .t2 span{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--clay-hi)}
.hr .gleam{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hr .gleam::before{content:"";position:absolute;top:0;bottom:0;left:-30%;width:26%;
  background:linear-gradient(105deg,transparent,rgba(225,242,255,.2),transparent)}
/* the stamp: the plate drops onto the screen, then each letter is struck in
   white-hot and cools to steel */
.hrw.play .hr{animation:plateLife 5.2s linear forwards}
.hrw.play.wo .hr{animation-duration:7.6s}
@keyframes plateLife{0%{transform:scale(1.18);opacity:0;animation-timing-function:var(--slam)}
  5.4%{transform:scale(.985);opacity:1;animation-timing-function:var(--ease-out)}
  9%{transform:none}
  90%{transform:none;opacity:1;animation-timing-function:var(--ease-in)}
  100%{transform:translateY(-10px);opacity:0}}
body[data-pos^="t"] .hrw.play .hr{animation-name:plateLifeT}
@keyframes plateLifeT{0%{transform:scale(1.18);opacity:0;animation-timing-function:var(--slam)}
  5.4%{transform:scale(.985);opacity:1;animation-timing-function:var(--ease-out)}
  9%{transform:none}
  90%{transform:none;opacity:1;animation-timing-function:var(--ease-in)}
  100%{transform:translateY(10px);opacity:0}}
.hrw.play .hcrest{animation:crestPop .6s .22s var(--ease-out) both}
@keyframes crestPop{from{transform:scale(.3) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
.hrw.play .t1 .ch{animation:strike .2s calc(.38s + var(--i) * 60ms) var(--slam) both,temper 2.2s calc(.58s + var(--i) * 60ms) linear both}
@keyframes strike{from{transform:scale(2) translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.hrw.play .t2 > *{animation:riseFlat .5s 1.05s var(--ease-out) both}
.hrw.play .t2 span{animation-delay:1.18s}
@keyframes riseFlat{from{transform:translateY(48px)}to{transform:none}}
.hrw.play .gleam::before{animation:gleam 1.3s 1.9s var(--ease-out) both}
@keyframes gleam{from{transform:translateX(0)}to{transform:translateX(520%)}}

/* ---------- The intro: full frame, before the first pitch ---------- */
.hero{position:absolute;inset:0;display:none;pointer-events:none;z-index:10}
.hero.on{display:block}
.hero .veil{position:absolute;inset:0;opacity:0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 4px),
    radial-gradient(ellipse 60% 70% at 50% 42%,rgba(23,34,58,.9) 0%,rgba(9,14,25,.95) 60%,rgba(3,6,11,.98) 100%)}
.hero.on .veil{animation:veil 9.8s linear forwards}
@keyframes veil{0%{opacity:0}6%{opacity:1}80%{opacity:1}96%,100%{opacity:0}}
.hero .halo{position:absolute;left:50%;top:330px;width:1100px;height:1100px;margin:-550px 0 0 -550px;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(127,192,239,.26) 0%,rgba(127,192,239,.08) 34%,transparent 62%)}
.hero.on .halo{animation:halo 7s 1.2s ease-in-out both}
@keyframes halo{0%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:scale(1)}100%{opacity:.7;transform:scale(1.08)}}
/* the forge light: a line that opens, then scans the crest into being */
.hero .scan{position:absolute;left:50%;top:102px;width:760px;height:3px;margin-left:-380px;border-radius:2px;opacity:0;
  background:linear-gradient(90deg,transparent,var(--steel-hi) 20%,#fff 50%,var(--steel-hi) 80%,transparent);
  box-shadow:0 0 18px 4px rgba(127,192,239,.7)}
.hero.on .scan{animation:scan 1.5s .35s cubic-bezier(.45,0,.2,1) both}
@keyframes scan{0%{opacity:0;transform:translateY(0) scaleX(0)}18%{opacity:1;transform:translateY(0) scaleX(1)}
  86%{opacity:1;transform:translateY(456px) scaleX(.9)}100%{opacity:0;transform:translateY(470px) scaleX(.2)}}
.hero .hlogo{position:absolute;left:50%;top:104px;width:440px;height:458px;margin-left:-220px}
.hero .hlogo .lg{clip-path:inset(0 0 100% 0)}
.hero.on .hlogo .lg{animation:reveal 1.23s .62s cubic-bezier(.45,0,.2,1) both}
@keyframes reveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 -10% 0)}}
.hero .word{position:absolute;left:0;right:0;top:590px;display:flex;flex-direction:column;align-items:center;gap:14px}
.hero .w1{display:flex;line-height:.9;white-space:nowrap;text-transform:uppercase}
.hero .w1 .ch{display:inline-block;font-size:176px;letter-spacing:.05em;color:var(--ink);text-shadow:0 7px 0 var(--edge),0 0 40px rgba(127,192,239,.2)}
.hero .w1 .sp{display:inline-block;width:.32em;font-size:176px}
.hero.on .w1 .ch{animation:strike .22s calc(2.05s + var(--i) * 80ms) var(--slam) both,
  temper 2.3s calc(2.27s + var(--i) * 80ms) linear both,ping .9s calc(4.3s + var(--i) * 55ms) ease-in-out}
@keyframes ping{0%,100%{color:var(--ink)}40%{color:#fff;text-shadow:0 7px 0 var(--edge),0 0 30px rgba(191,227,251,.95)}}
.hero .w2{text-transform:uppercase;font-size:58px;letter-spacing:.42em;margin-right:-.42em;color:var(--steel);text-shadow:0 4px 0 var(--edge);opacity:0}
.hero.on .w2{animation:track 1.2s 3.05s var(--ease-out) both}
@keyframes track{from{opacity:0;letter-spacing:1.1em;margin-right:-1.1em}to{opacity:1;letter-spacing:.42em;margin-right:-.42em}}
.hero .w3{display:flex;align-items:center;gap:22px;font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;color:var(--dim);opacity:0}
.hero .w3 i{width:90px;height:2px;background:linear-gradient(90deg,transparent,var(--steel))}
.hero .w3 i + span + em + span + i{background:linear-gradient(90deg,var(--steel),transparent)}
.hero .w3 span{color:var(--ink)} .hero .w3 em{font-style:normal;color:var(--clay)}
.hero.on .w3{animation:fadeUp .9s 3.6s var(--ease-out) both}
.hero.on .word{animation:wordOut .7s 7.4s var(--ease-in) forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes wordOut{to{opacity:0;transform:translateY(-14px)}}

/* ---------- First paint: the package builds out of the crest ---------- */
#bug.intro .crest{animation:crestPop .6s var(--ease-out) both}
#bug.intro .plate{animation:build .7s .15s var(--ease-out) both}
#bug.intro .strip{animation:lineIn .5s .5s var(--ease-out) both}
#bug.landed .plate{animation:build .8s var(--ease-out) both}
#bug.landed .strip{animation:lineIn .5s .4s var(--ease-out) both}
@keyframes build{from{clip-path:polygon(0 0,0 0,0 100%,0 100%)}to{clip-path:polygon(15px 0,100% 0,100% calc(100% - 15px),calc(100% - 15px) 100%,0 100%,0 15px)}}
body[data-pos$="r"] #bug.intro .plate,body[data-pos$="r"] #bug.landed .plate{animation-name:buildR}
@keyframes buildR{from{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%)}to{clip-path:polygon(15px 0,100% 0,100% calc(100% - 15px),calc(100% - 15px) 100%,0 100%,0 15px)}}

@media (prefers-reduced-motion:reduce){
  .lg .f,.lg .eye,body.rally .plate{animation:none!important}
  .rail.spec::after,.lg.shine .sh::before,.dia .b.pop,.bso i.pop,#bug.intro *,#bug.landed *{animation:none!important}
}
</style>
</head>
<body>
<div id="stage">
  <div id="bug">
    <div class="pkg">
      <div class="crest"></div>
      <div class="main">
        <div class="stack">
        <div class="plate"><div class="rail">
          <div class="team" data-t="away"><div class="slab"><span class="ab"></span></div><div class="score"><span class="roll" data-k="away"></span></div></div>
          <div class="team" data-t="home"><div class="slab"><span class="ab"></span></div><div class="score"><span class="roll" data-k="home"></span></div></div>
          <div class="sit">
            <div class="inn">
              <i class="arr up"></i><span class="n roll" data-k="inning"></span><i class="arr dn"></i>
              <div class="shut"><small>MID</small><b>1</b></div>
            </div>
            <svg class="dia" viewBox="0 0 64 56" aria-hidden="true">
              <path class="path" d="M32 49 L51 30 L32 11 L13 30 Z"/>
              <path class="plateH" d="M28.5 46.5 h7 v3.2 l-3.5 3 l-3.5 -3 z"/>
              <path class="trace" pathLength="4" d="M32 49 L51 30 L32 11 L13 30 L32 49"/>
              <g class="b" data-b="2"><rect x="25.5" y="4.5" width="13" height="13" transform="rotate(45 32 11)"/></g>
              <g class="b" data-b="3"><rect x="6.5" y="23.5" width="13" height="13" transform="rotate(45 13 30)"/></g>
              <g class="b" data-b="1"><rect x="44.5" y="23.5" width="13" height="13" transform="rotate(45 51 30)"/></g>
            </svg>
            <div class="bso">
              <em>B</em><div class="dots b"><i></i><i></i><i></i></div>
              <em>S</em><div class="dots s"><i></i><i></i></div>
              <em>O</em><div class="dots o"><i></i><i></i></div>
            </div>
            <div class="clk" hidden><em>TIME</em><b></b></div>
          </div>
        </div></div>
        <div class="strip"></div>
        </div>
        <div class="kw"><div class="kflag"><div class="kin"><div class="k"><span>K</span></div><div class="kt"><b></b><small></small></div></div></div><i class="blade"></i></div>
        <div class="hrw">
          <div class="hr"><div class="hin">
            <div class="hcrest"></div>
            <div class="hbody"><div class="t1"></div><div class="t2"><i></i><b></b><span></span></div></div>
            <div class="gleam"></div>
          </div></div>

    </div>
  </div>

  <div class="hero" aria-hidden="true">
    <div class="veil"></div>
    <div class="halo"></div>
    <div class="hlogo"></div>
    <i class="scan"></i>
    <div class="word">
      <div class="w1"></div>
      <div class="w2">Baseball</div>
      <div class="w3"><i></i><span></span><em>at</em><span></span><i></i></div>
    </div>
  </div>
  <canvas id="fx" width="1920" height="1080"></canvas>
</div>

<script src="kit.js"></script>
<script>
(() => {
  const { $, $$, restart, battingTeam, fieldingTeam, params } = BugKit;
  const stage = $("#stage"), bug = $("#bug"), pkg = $(".pkg"), rail = $(".rail"), strip = $(".strip"), hrw = $(".hrw"), kflag = $(".kw"), inn = $(".inn");
  const hero = $(".hero");
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const up = (t) => String(t ?? "").toUpperCase();
  const words = (n) => String(n || "").trim().split(/\s+/).filter(Boolean);
  const surname = (n) => { const w = words(n); return w.length ? w[w.length - 1] : ""; };
  const ordinal = (n) => { const s = ["TH", "ST", "ND", "RD"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
  const abbrOf = (S, t) => up(S[t].abbr || S[t].name);
  const team = (t) => $(`.team[data-t="${t}"]`);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const later = (ms, fn) => setTimeout(fn, ms);
  let cur = null;
  const ks = new Map();   // strikeouts by pitcher, this broadcast (demo)

  /* ---------- The crest, wherever it appears ---------- */
  const LOGO = `<div class="lg"><img class="u" src="img/bluesteel-under.webp" alt=""><img class="f" src="img/bluesteel-feathers.webp" alt="">` +
    `<img class="s" src="img/bluesteel-skull.webp" alt=""><i class="eye"></i><i class="strk"></i><i class="sh"></i></div>`;
  for (const el of $$(".crest, .hcrest, .hlogo")) el.innerHTML = LOGO;
  const crest = $(".crest .lg"), hcrest = $(".hcrest .lg"), hlogo = $(".hlogo .lg");
  const flare = (lg) => { restart(lg, "flare"); restart(lg, "gust"); };
  const shine = (lg) => restart(lg, "shine");
  setInterval(() => shine(crest), 16e3);
  setInterval(() => restart(rail, "spec"), 23e3);

  /* ---------- Sparks and embers: one canvas, awake only while they fly ---------- */
  const fxc = $("#fx"), ctx = fxc.getContext("2d");
  const HOT = [[255, 252, 238], [255, 220, 160], [255, 165, 95], [224, 121, 74], [120, 40, 20]];
  const COLD = [[255, 255, 255], [220, 243, 255], [170, 216, 248], [127, 192, 239], [40, 80, 125]];
  let P = [], raf = 0, last = 0;
  const tint = (pal, t) => {
    const x = Math.min(pal.length - 1.001, Math.max(0, t) * (pal.length - 1)), i = x | 0, f = x - i, a = pal[i], b = pal[i + 1];
    return `${(a[0] + (b[0] - a[0]) * f) | 0},${(a[1] + (b[1] - a[1]) * f) | 0},${(a[2] + (b[2] - a[2]) * f) | 0}`;
  };
  function wake() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); } }
  function step(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    ctx.clearRect(0, 0, 1920, 1080);
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";
    P = P.filter((p) => (p.age += dt) < p.life);
    for (const p of P) {
      const t = p.age / p.life;
      if (p.ember) {
        p.vx += Math.sin(p.age * p.w + p.ph) * p.sway * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        const c = tint(p.pal, 0.25 + t * 0.7), a = Math.min(1, t / 0.12) * (1 - t) * p.o;
        ctx.fillStyle = `rgba(${c},${a * 0.22})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.s * 2.8, 0, 6.2832); ctx.fill();
        ctx.fillStyle = `rgba(${c},${a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 6.2832); ctx.fill();
      } else {
        const k = Math.max(0, 1 - p.drag * dt);
        p.vx *= k; p.vy = p.vy * k + p.g * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        ctx.strokeStyle = `rgba(${tint(p.pal, t)},${1 - t * t})`;
        ctx.lineWidth = p.s * (1 - t * 0.6);
        ctx.beginPath(); ctx.moveTo(p.x - p.vx * 0.045, p.y - p.vy * 0.045); ctx.lineTo(p.x, p.y); ctx.stroke();
      }
    }
    if (P.length) raf = requestAnimationFrame(step);
    else { raf = 0; ctx.clearRect(0, 0, 1920, 1080); }
  }
  // A burst of sparks from (x, y) in stage pixels, thrown along `angle` (degrees, 0 = right, -90 = up).
  function burst(x, y, { n = 24, speed = [260, 720], angle = -90, spread = 150, pal = HOT, g = 1500, life = [0.35, 0.9], size = [1.8, 3.4], drag = 1.2 } = {}) {
    if (P.length > 700) return;
    for (let i = 0; i < n; i++) {
      const a = (angle + rnd(-spread / 2, spread / 2)) * Math.PI / 180, v = rnd(...speed);
      P.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g, drag, pal, life: rnd(...life), s: rnd(...size), age: 0 });
    }
    wake();
  }
  // Embers drifting up from a span of (x0..x1, y).
  function embers(x0, x1, y, n, pal = COLD, { vy = [-50, -130], life = [1.6, 3.4], size = [1.1, 2.4], o = 0.9 } = {}) {
    if (P.length > 700) return;
    for (let i = 0; i < n; i++) {
      P.push({ ember: true, x: rnd(x0, x1), y: y + rnd(-6, 6), vx: rnd(-12, 12), vy: rnd(...vy), sway: rnd(20, 60), w: rnd(1.5, 3.5), ph: rnd(0, 6),
        pal, life: rnd(...life), s: rnd(...size), o, age: 0 });
    }
    wake();
  }
  // An element's point in stage pixels (fx, fy: 0..1 across it).
  function pt(el, fx = 0.5, fy = 0.5) {
    const s = stage.getBoundingClientRect(), k = s.width / 1920, r = el.getBoundingClientRect();
    return [(r.left - s.left + r.width * fx) / k, (r.top - s.top + r.height * fy) / k];
  }
  const shake = (el = pkg, amp = 4) => el.animate([
    { transform: "none" }, { transform: `translate(${-amp}px,${amp * 0.6}px)` }, { transform: `translate(${amp}px,${-amp * 0.5}px)` },
    { transform: `translate(${-amp * 0.5}px,${amp * 0.3}px)` }, { transform: "none" }], { duration: 300, easing: "ease-out" });

  /* ---------- Rolling numerals ---------- */
  function roll(el, val, instant) {
    const v = String(val);
    if (el.dataset.v === v) return;
    const from = Number(el.dataset.v);
    el.dataset.v = v;
    const old = el.lastElementChild;
    if (instant || !old) { el.innerHTML = `<b>${esc(v)}</b>`; return; }
    const d = Number.isFinite(from) && Number(v) < from ? -1 : 1;
    const nu = document.createElement("b");
    nu.textContent = v;
    el.appendChild(nu);
    old.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: `translateY(${-90 * d}%)`, opacity: 0 }],
      { duration: 300, easing: "cubic-bezier(.7,0,.84,0)", fill: "forwards" }).onfinish = () => old.remove();
    nu.animate([{ transform: `translateY(${90 * d}%)`, opacity: 0 }, { transform: "translateY(0)", opacity: 1 }],
      { duration: 420, delay: 90, easing: "cubic-bezier(.16,1,.3,1)", fill: "backwards" });
  }
  // Letters that can be struck one at a time.
  const letters = (el, text) => {
    el.innerHTML = [...String(text)].map((c, i) => (c === " " ? `<span class="sp"></span>` : `<span class="ch" style="--i:${i}">${esc(c)}</span>`)).join("");
    return $$(".ch", el);
  };

  /* ---------- The strip: the at-bat, or a play tag for a moment ---------- */
  let holdUntil = 0, holdTimer = null, lastSay = { at: 0 };
  function setLine(main, side, animate, cls) {
    const old = strip.querySelector(".line:not(.out)");
    if (old && old.dataset.main === main) {
      const sd = old.querySelector(".side");
      if (sd && sd.innerHTML !== side) sd.innerHTML = side;
      return;
    }
    const nu = document.createElement("div");
    nu.className = "line" + (cls ? " " + cls : "");
    nu.dataset.main = main;
    nu.innerHTML = main + (side != null ? `<span class="side">${side}</span>` : "");
    if (old) {
      if (animate) { old.classList.add("out"); setTimeout(() => old.remove(), 320); nu.classList.add("in"); }
      else old.remove();
    }
    strip.appendChild(nu);
  }
  function atBat(S, animate) {
    const pc = S.pitchCount ? `<b>${S.pitchCount}</b>` : "";
    const side = S.pitcher ? `P · ${esc(up(surname(S.pitcher)))}${pc}` : pc ? `Pitches${pc}` : "";
    const outs = S.outs === 1 ? "1 out" : `${Math.min(S.outs, 2)} outs`;
    const main = S.batter ? `<span class="tag">AB</span><span class="txt">${esc(up(S.batter))}</span>`
      : `<span class="tag">${S.half === "top" ? "TOP" : "BOT"} ${S.inning}</span><span class="txt">${esc(up(outs))}</span>`;
    setLine(main, side, animate);
  }
  function say(tag, cls, text, ms = 2800) {
    lastSay = { tag, cls, text, at: Date.now() };
    holdUntil = Date.now() + ms;
    setLine(`<span class="tag ${cls}">${esc(tag)}</span><span class="txt">${esc(up(text))}</span>`, null, true);
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => { holdUntil = 0; if (cur) atBat(cur, true); }, ms);
  }
  // The club line: the crest and the name, between innings now and then.
  const CLUB_GAP = 6 * 60e3;
  let lastClub = Date.now() - CLUB_GAP + 120e3;
  function club(ms = 5200) {
    lastClub = Date.now();
    holdUntil = Date.now() + ms;
    setLine(`<span class="ico"></span><span class="txt">Blue Steel Baseball</span>`, null, true, "club");
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => { holdUntil = 0; if (cur) atBat(cur, true); }, ms);
    flare(crest); shine(crest);
  }

  /* ---------- Hits: the runner's path lights round the diamond ---------- */
  const trace = $(".dia .trace");
  function run(bases) {
    trace.getAnimations().forEach((a) => a.cancel());
    const k = Math.min(4, bases);
    trace.style.strokeDasharray = `${k} 8`;
    trace.animate([{ strokeDashoffset: k, opacity: 1 }, { strokeDashoffset: 0, opacity: 1, offset: 0.55 }, { strokeDashoffset: 0, opacity: 0 }],
      { duration: 700 + k * 260, easing: "cubic-bezier(.45,0,.2,1)" });
  }

  /* ---------- The home run plate ---------- */
  function banner(S, t, title, who, what, wo) {
    const hr = $(".hr", hrw);
    hr.style.setProperty("--tc", S[t].color);
    const chars = letters($(".t1", hr), title);
    $(".t2 b", hr).textContent = who;
    $(".t2 span", hr).textContent = what;
    hrw.classList.toggle("wo", !!wo);
    restart(hrw, "play");
    const big = /slam|walk/i.test(title);
    const top = document.body.dataset.pos[0] === "t";
    later(290, () => {                                   // the plate lands
      shake(pkg, big ? 6 : 4);
      for (let i = 0; i < 6; i++) { const [x, y] = pt(hr, 0.08 + i * 0.17, top ? 0 : 1); burst(x, y, { n: big ? 14 : 9, angle: top ? 90 : -90, spread: 170, speed: [200, 560], life: [0.3, 0.7] }); }
    });
    chars.forEach((ch, i) => later(580 + i * 60, () => {  // each letter struck
      const [x, y] = pt(ch, 0.5, 0.9);
      burst(x, y, { n: big ? 10 : 7, spread: 120, speed: [220, 620], life: [0.3, 0.75], size: [1.2, 2.4] });
    }));
    later(560 + chars.length * 60, () => shake(pkg, 2.5));
    later(700, () => flare(hcrest));
    later(950, () => { restart(rail, "spec"); flare(crest); shine(crest); });
    const [x0] = pt(hr, 0.05, 0), [x1, y] = pt(hr, 0.95, top ? 1 : 0);
    for (let i = 0; i < (wo ? 14 : 8); i++) later(500 + i * 260, () => embers(x0, x1, y, 5, i % 3 ? COLD : HOT));
    if (wo) for (let i = 0; i < 12; i++) later(900 + i * 240, () => {
      const [x, yy] = pt(hr, rnd(0.1, 0.9), top ? 1 : 0);
      burst(x, yy, { n: 18, angle: top ? 90 : -90, spread: 110, speed: [380, 900], pal: i % 2 ? COLD : HOT, life: [0.5, 1.1] });
    });
  }

  /* ---------- The intro (full frame, before the first pitch) ----------
     Plays once, when the bug first shows on a game that hasn't started: a
     forge light scans the crest into being, its eye catches, BLUE STEEL is
     struck one letter at a time, then the crest flies down into the bug and
     the bug builds out of it. Inside the live overlay it waits while a
     full-frame card (Starting Soon) hides the bug. ?intro=1 forces it on the
     demo page; ?intro=0 turns it off. */
  let heroBusy = false, heroEmbers = null;
  const pregame = (S) => S.inning === 1 && S.half === "top" && !S.outs && !S.balls && !S.strikes &&
    !S.away.r && !S.home.r && !S.bases.some(Boolean);
  const shown = () => {
    try { const f = window.frameElement; return !f || getComputedStyle(f).visibility !== "hidden"; } catch { return true; }
  };
  function playHero() {
    heroBusy = true;
    bug.classList.add("await");
    const S = cur;
    const w3 = $$(".w3 span", hero);
    w3[0].textContent = S ? abbrOf(S, "away") : "";
    w3[1].textContent = S ? abbrOf(S, "home") : "";
    $(".w3", hero).style.display = S ? "" : "none";
    const chars = letters($(".w1", hero), "Blue Steel");
    hero.classList.remove("on"); void hero.offsetWidth; hero.classList.add("on");
    later(1500, () => {
      flare(hlogo);
      const [x, y] = pt($(".eye", hlogo));
      burst(x, y, { n: 34, angle: 180, spread: 110, pal: COLD, g: 300, speed: [120, 520], life: [0.5, 1.2], size: [1, 2.2], drag: 2.2 });
    });
    chars.forEach((ch, i) => later(2270 + i * 80, () => {
      const [x, y] = pt(ch, 0.5, 0.92);
      burst(x, y, { n: 16, spread: 130, speed: [300, 900], life: [0.4, 1], size: [1.4, 3] });
      if (i === chars.length - 1) { shake($(".word", hero), 7); shake($(".hlogo", hero), 3); }
    }));
    later(4300, () => shine(hlogo));
    later(5600, () => flare(hlogo));
    clearInterval(heroEmbers);
    heroEmbers = setInterval(() => embers(200, 1720, 1100, 4, Math.random() < 0.3 ? HOT : COLD, { vy: [-90, -220], life: [3, 5.5], size: [1.2, 3] }), 140);
    later(7300, () => clearInterval(heroEmbers));
    later(7800, fold);
  }
  function fold() {
    // Fly the big crest onto the bug's, in stage pixels.
    const big = $(".hlogo", hero), s = stage.getBoundingClientRect().width / 1920;
    const a = big.getBoundingClientRect(), b = $(".crest").getBoundingClientRect();
    const dx = (b.left + b.width / 2 - (a.left + a.width / 2)) / s, dy = (b.top + b.height / 2 - (a.top + a.height / 2)) / s;
    const k = b.height / a.height;
    big.animate([{ transform: "none" }, { transform: `translate(${dx}px,${dy}px) scale(${k})` }],
      { duration: 1100, easing: "cubic-bezier(.65,0,.35,1)", fill: "forwards" }).onfinish = () => {
      bug.classList.remove("await");
      restart(bug, "landed");
      flare(crest); shine(crest);
      const [x, y] = pt($(".crest"));
      burst(x, y, { n: 26, spread: 360, pal: COLD, g: 400, speed: [120, 420], life: [0.4, 0.9], size: [1, 2] });
      setTimeout(() => { hero.classList.remove("on"); big.getAnimations().forEach((x) => x.cancel()); heroBusy = false; }, 900);
    };
  }
  let heroArmed = params.get("intro") !== "0";
  function maybeHero(S) {
    if (!heroArmed) return false;
    heroArmed = false;
    if (params.get("intro") !== "1" && !pregame(S)) return false;
    if (shown()) { playHero(); return true; }
    bug.classList.add("await");
    const wait = setInterval(() => { if (shown()) { clearInterval(wait); playHero(); } }, 400);
    return true;
  }

  /* ---------- Rally: the eye burns and embers come off the plate ---------- */
  let rallyTimer = null;
  new MutationObserver(() => {
    const on = document.body.classList.contains("rally");
    if (on && !rallyTimer) {
      flare(crest);
      rallyTimer = setInterval(() => {
        if (heroBusy) return;
        const plate = $(".plate"), top = document.body.dataset.pos[0] === "t";
        const [x0, y] = pt(plate, 0.02, top ? 1 : 0), [x1] = pt(plate, 0.98, 0);
        embers(x0, x1, y, 2, Math.random() < 0.35 ? HOT : COLD, { vy: top ? [30, 70] : [-40, -100], life: [1.2, 2.4] });
      }, 260);
    } else if (!on && rallyTimer) { clearInterval(rallyTimer); rallyTimer = null; }
  }).observe(document.body, { attributes: true, attributeFilter: ["class"] });

  /* ---------- Paint ---------- */
  function dots(sel, n, first) {
    $$(sel + " i").forEach((d, i) => {
      const on = i < n;
      if (on && !d.classList.contains("on") && !first) restart(d, "pop");
      d.classList.toggle("on", on);
    });
  }
  // The time limit: shown only while the overlay sends one. The last minute
  // reads in clay; at zero it blinks red and the strip says so, once.
  const clk = $(".clk");
  let clkZero = null;
  function clock(c) {
    const off = !!c.hidden || !c.text;
    if (clk.hidden && !off) restart(clk, "show");
    clk.hidden = off;
    if (off) { clkZero = null; return; }
    $("b", clk).textContent = c.text;
    clk.classList.toggle("low", !!c.low);
    clk.classList.toggle("zero", !!c.zero);
    if (c.zero && clkZero === false) {
      restart(clk, "hit");
      const [x, y] = pt(clk);
      burst(x, y, { n: 18, spread: 360, pal: HOT, g: 500, speed: [120, 380], life: [0.3, 0.7], size: [1.2, 2.2] });
      if (!heroBusy) say("TIME", "red", "Time limit reached", 4200);
    }
    clkZero = !!c.zero;
  }

  // A moment's flag and plate go back to hidden when they finish, so nothing
  // is left drawn beside the bug.
  $(".kflag").addEventListener("animationend", (e) => { if (/^cutIn/.test(e.animationName)) kflag.classList.remove("play"); });
  $(".hr", hrw).addEventListener("animationend", (e) => { if (/^plateLife/.test(e.animationName)) hrw.classList.remove("play"); });

  BugKit.start({
    name: "Blue Steel",
    hrDelay: 2500,
    clock,
    render(S, prev, first) {
      cur = S;
      for (const t of ["away", "home"]) {
        const el = team(t);
        el.style.setProperty("--tc", S[t].color);
        $(".ab", el).textContent = abbrOf(S, t);
        roll($(".score .roll", el), S[t].r, first);
        el.classList.toggle("bat", battingTeam(S) === t);
      }
      roll($(".inn .n"), S.inning, first);
      $(".inn .up").classList.toggle("on", S.half === "top");
      $(".inn .dn").classList.toggle("on", S.half !== "top");
      $$(".dia .b").forEach((g) => {
        const i = +g.dataset.b - 1, on = !!S.bases[i];
        if (on && !g.classList.contains("on") && !first) restart(g, "pop");
        g.classList.toggle("on", on);
      });
      // the board never shows four balls or three strikes; the play says that
      dots(".bso .b", Math.min(S.balls, 3), first);
      dots(".bso .s", Math.min(S.strikes, 2), first);
      dots(".bso .o", Math.min(S.outs, 2), first);
      if (first) { atBat(S, false); if (!maybeHero(S)) { restart(bug, "intro"); later(250, () => flare(crest)); } }
      else if (Date.now() > holdUntil) atBat(S, true);
    },
    fx: {
      run({ team: t, runs = 1, hr: homer }, S) {
        t ||= battingTeam(S);
        const el = team(t);
        later(homer ? 0 : 300, () => {
          el.classList.remove("temper", "stamp"); void el.offsetWidth; el.classList.add("temper", "stamp");
          const sc = $(".score", el), topPos = document.body.dataset.pos[0] === "t";
          const [x, y] = pt(sc, 0.5, topPos ? 1 : 0);
          burst(x, y, { n: 20 + runs * 8, angle: topPos ? 90 : -90, spread: 120, speed: [260, 700] });
          const [ex] = pt(sc, 0.5, 0.5);
          embers(ex - 30, ex + 30, y, 6, HOT, { vy: topPos ? [30, 80] : [-40, -110], life: [0.9, 1.8] });
          restart(rail, "spec");
          flare(crest);
        });
        if (homer) return;
        const scored = runs === 1 ? "Run scores" : `${runs} runs score`;
        if (Date.now() - lastSay.at < 250) say(lastSay.tag, lastSay.cls, `${lastSay.text} · ${scored}`);
        else say("RUN", "hot", `${scored} · ${abbrOf(S, t)} ${S[t].r}`);
      },
      hr({ runs = 1, batter, team: t }, S) {
        t ||= battingTeam(S);
        const who = batter || S.batter;
        const what = runs === 4 ? "Four runs score" : runs === 1 ? "Solo shot" : `${runs}-run homer`;
        banner(S, t, runs === 4 ? "Grand slam" : "Home run", who ? `${who} · ${abbrOf(S, t)}` : abbrOf(S, t), what);
        run(4);
        const kind = runs === 1 ? "solo" : runs === 4 ? "grand slam" : runs + "-run";
        say("HR", "hot", who ? `${who} · ${kind}` : `${kind} home run`, 5200);
      },
      k({ looking, batter }, S) {
        const ft = fieldingTeam(S);
        const who = S.pitcher || abbrOf(S, ft);
        ks.set(who, (ks.get(who) || 0) + 1);
        const n = S[ft].k > 0 ? S[ft].k : ks.get(who);
        kflag.classList.toggle("looking", !!looking);
        $(".kt b", kflag).textContent = looking ? "Called strike three" : "Strikes out swinging";
        const bat = surname(batter || S.batter);
        $(".kt small", kflag).innerHTML = `${bat ? esc(up(bat)) + " · " : ""}${esc(up(surname(who)))} <em>${n}K</em>`;
        restart(kflag, "play");
        const right = document.body.dataset.pos[1] === "r";
        later(430, () => {
          const [x, y] = pt(kflag, right ? 0 : 1, 0.5);
          burst(x, y, { n: 22, angle: right ? 180 : 0, spread: 100, pal: COLD, g: 900, speed: [220, 640], life: [0.3, 0.7], size: [1, 2.2] });
        });
        later(220, () => flare(crest));
        const b = batter || S.batter;
        say(looking ? "ꓘ" : "K", "red", b ? `${b} ${looking ? "caught looking" : "strikes out"}` : looking ? "Called strike three" : "Strikeout swinging");
      },
      hit({ bases = 1, batter }) {
        run(bases);
        say(["SINGLE", "DOUBLE", "TRIPLE"][bases - 1] || "HIT", "ice", batter || "Base hit");
      },
      walk({ batter }) { run(1); say("WALK", "green", batter ? `${batter} takes first` : "Ball four"); },
      error({ team: t }, S) { shake(pkg, 2); say("E", "hot", `Error · ${abbrOf(S, t || fieldingTeam(S))}`); },
      out({ batter }, S) {
        later(40, () => {
          const d = $$(".bso .o i")[Math.min(S.outs, 2) - 1];
          if (d) { const [x, y] = pt(d); burst(x, y, { n: 8, spread: 360, pal: COLD, g: 200, speed: [80, 220], life: [0.25, 0.5], size: [1, 1.8] }); }
        });
        say("OUT", "", batter || (S.outs >= 3 ? "Side retired" : S.outs === 2 ? "Two down" : "One down"), 1800);
      },
      half({ inning, half }, S) {
        const was = half === "bot" ? inning : inning - 1;
        $(".shut small", inn).textContent = half === "bot" ? "MID" : "END";
        $(".shut b", inn).textContent = was;
        inn.classList.remove("up");
        restart(inn, "down");
        later(2700, () => { inn.classList.remove("down"); restart(inn, "up"); });
        later(420, () => shine(crest));
        say(`${half === "bot" ? "MID" : "END"} ${ordinal(was)}`, "ice", `${abbrOf(S, battingTeam(S))} coming to bat`, 2700);
        if (Date.now() - lastClub > CLUB_GAP) later(2800, () => { if (Date.now() >= holdUntil) club(); });
      },
      walkoff({ team: t, batter }, S) {
        t ||= battingTeam(S);
        const o = t === "away" ? "home" : "away";
        const line = `${abbrOf(S, t)} win ${S[t].r}-${S[o].r}`;
        banner(S, t, "Walk-off", batter || S.batter || abbrOf(S, t), line, true);
        restart(team(t), "win");
        say("WALK-OFF", "hot", line, 7400);
      },
      reset() { ks.clear(); restart(bug, "intro"); later(250, () => flare(crest)); }
    }
  });

  // Demo page: play the intro again, or the club line.
  const demo = $("#demo");
  if (demo) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<button data-bs="hero">Play the intro</button><button data-bs="club">Club line</button><button data-bs="clock" aria-pressed="false">Time limit</button>`;
    let secs = 0, tick = null;   // a demo time limit that runs into its last minute and out
    const paint = () => { const t = Math.max(0, secs); clock({ hidden: false, text: `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`, low: t <= 60 && t > 0, zero: t <= 0 }); secs--; };
    demo.querySelector("p").before(row);
    row.addEventListener("click", (e) => {
      const b = e.target.closest("[data-bs]");
      if (!b) return;
      if (b.dataset.bs === "hero" && !heroBusy) playHero();
      if (b.dataset.bs === "club") club();
      if (b.dataset.bs === "clock") {
        clearInterval(tick); tick = null;
        const on = b.getAttribute("aria-pressed") !== "true";
        b.setAttribute("aria-pressed", String(on));
        if (on) { secs = 68; paint(); tick = setInterval(paint, 1000); } else clock({ hidden: true });
      }
    });
  }
})();
</script>
</body>
</html>
