<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scoreboard Theme: Forever 20</title>
<link rel="preload" href="../fonts/bugs/graduate-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/barlow-condensed-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="img/forever20-ribbon.webp" as="image">
<style>
/* Self-hosted fonts (latin subset), so nothing reaches a font CDN on air. */
@font-face{font-family:'Graduate';font-weight:400;font-display:swap;src:url('../fonts/bugs/graduate-400.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;font-display:swap;src:url('../fonts/barlow-condensed-600.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-display:swap;src:url('../fonts/barlow-condensed-700.woff2') format('woff2')}
</style>
<style>
/* ============================================================
   FOREVER 20 — in memory of Julian, #20, Sanger TX.
   Built from the memorial ribbon: ribbon purple, a gold edge, varsity
   block numerals, and the ribbon's arrow. The ribbon itself is pinned to
   the bug. Before the first pitch it opens with a full-frame tribute that
   folds down into that pin; through the game the strip remembers him
   between innings, and the arrow carries every run and home run.
   ============================================================ */
:root{
  --purple:#472a68; --purple-hi:#5a3787; --purple-lo:#2c1548; --well:#1c0b33; --edge:#1a0a2e;
  --gold:#c9a24a; --gold-hi:#f2d27a; --gold-lo:#8f6d25; --yellow:#f4c84a;
  --ink:#fbf3dc; --dim:#b9a8d2; --rule:rgba(201,162,74,.35);
  --crimson:#c53a4b; --green:#5fcf8a; --amber:#f0a53a;
  --varsity:"Graduate","Rockwell","Arial Black",serif;
  --font:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.7,0,.84,0);
  --ribbon:url(img/forever20-ribbon.webp);
}
body{--demo-accent:var(--gold)}
body.preview{background:
  radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.06),transparent 55%),
  linear-gradient(160deg,#2f5a34 0%,#23452a 38%,#6b4f35 70%,#3d2c1e 100%)}
#stage{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}

/* ---------- Bug: the ribbon pin, then the rail with its strip ---------- */
#bug{display:flex;align-items:center;filter:drop-shadow(0 12px 26px rgba(0,0,0,.5))}
#bug.await{visibility:hidden}
.main{display:flex;flex-direction:column;align-items:stretch}
body[data-pos^="b"] .main{flex-direction:column-reverse}

/* the pin: Shawn's ribbon, overlapping the rail's leading edge */
.medal{position:relative;z-index:2;width:74px;height:126px;margin-right:-16px;flex:0 0 auto}
.medal img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
/* a sheen clipped to the ribbon's own shape */
.shine{position:absolute;inset:0;pointer-events:none;overflow:hidden;
  -webkit-mask:var(--ribbon) center/contain no-repeat;mask:var(--ribbon) center/contain no-repeat}
.shine::before{content:"";position:absolute;top:-10%;bottom:-10%;left:-60%;width:60%;
  background:linear-gradient(100deg,transparent,rgba(255,244,210,.85) 50%,transparent);transform:translateX(0)}
.shine.go::before{animation:shine 1.5s var(--ease-out)}
@keyframes shine{to{transform:translateX(360%)}}
.medal.glow img{animation:medalGlow 3.2s ease-in-out}
@keyframes medalGlow{0%,100%{filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
  40%,60%{filter:drop-shadow(0 0 10px rgba(242,210,122,.9)) drop-shadow(0 3px 5px rgba(0,0,0,.55))}}

.rail{position:relative;display:flex;align-items:stretch;height:72px;padding:4px 4px 4px 20px;border-radius:9px;overflow:hidden;
  background:linear-gradient(180deg,var(--purple-hi) 0%,var(--purple) 42%,var(--purple-lo) 100%);
  box-shadow:0 0 0 2px var(--edge),inset 0 0 0 3px var(--gold),inset 0 0 0 5px var(--edge),inset 0 7px 12px rgba(255,255,255,.08)}
/* a slow gold light that crosses the rail on big moments */
.rail::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(242,210,122,.32) 50%,transparent 65%);transform:translateX(-110%)}
.rail.sheen::after{animation:sheen 1.2s var(--ease-out)}
@keyframes sheen{to{transform:translateX(110%)}}

/* team block: a team-colour stitch, the abbreviation, then the score well */
.team{position:relative;display:flex;align-items:stretch}
.team + .team{box-shadow:-1px 0 0 var(--rule)}
.slab{position:relative;display:flex;align-items:center;justify-content:center;min-width:120px;padding:0 14px 0 22px}
.slab::before{content:"";position:absolute;left:8px;top:10px;bottom:10px;width:6px;border-radius:3px;background:var(--tc);
  box-shadow:0 0 0 1.5px rgba(242,210,122,.55)}
.ab{position:relative;font-family:var(--varsity);font-size:29px;letter-spacing:.03em;line-height:1;text-transform:uppercase;
  color:var(--ink);text-shadow:0 2px 0 var(--edge),0 3px 6px rgba(0,0,0,.4);white-space:nowrap}
.score{position:relative;display:flex;align-items:center;justify-content:center;width:74px;margin:2px 0;border-radius:5px;
  background:var(--well);box-shadow:inset 0 2px 7px rgba(0,0,0,.7),inset 0 0 0 1px rgba(201,162,74,.28)}
.score .roll{font-family:var(--varsity);font-size:44px;line-height:1;font-variant-numeric:tabular-nums;
  color:var(--gold-hi);text-shadow:0 2px 0 #4a2d0c,0 0 10px rgba(242,210,122,.25)}
/* batting marker: a gold arrow along the foot of the batting team */
.team::after{content:"";position:absolute;left:10px;right:10px;bottom:1px;height:4px;border-radius:2px;background:var(--gold-hi);
  box-shadow:0 0 10px rgba(242,210,122,.8);transform:scaleX(0);transform-origin:0 50%;transition:transform .5s var(--ease-out)}
.team::before{content:"";position:absolute;right:4px;bottom:-3px;width:0;height:0;z-index:1;
  border-left:10px solid var(--gold-hi);border-top:5px solid transparent;border-bottom:5px solid transparent;
  opacity:0;transition:opacity .3s .3s}
.team.bat::after{transform:scaleX(1)}
.team.bat::before{opacity:1}
/* a run: the score well flashes gold */
.team.flash .score{animation:wellFlash 1.5s var(--ease-out)}
@keyframes wellFlash{0%,22%{background:var(--gold-hi);box-shadow:0 0 24px rgba(242,210,122,.9)}100%{background:var(--well)}}
.team.flash .score .roll{animation:numFlash 1.5s var(--ease-out)}
@keyframes numFlash{0%,22%{color:var(--purple-lo);text-shadow:none}100%{}}
/* walk-off: the winners' block pulses gold */
.team.win .slab{animation:winPulse 1.1s ease-in-out 4}
@keyframes winPulse{50%{box-shadow:inset 0 0 0 3px var(--gold-hi),inset 0 0 30px rgba(242,210,122,.5)}}
/* rally mode (the pad's Rally): the rail breathes gold */
body.rally .rail{animation:rally 1.6s ease-in-out infinite}
@keyframes rally{0%,100%{box-shadow:0 0 0 2px var(--edge),inset 0 0 0 3px var(--gold),inset 0 0 0 5px var(--edge),0 0 0 0 rgba(242,210,122,0)}
  50%{box-shadow:0 0 0 2px var(--edge),inset 0 0 0 3px var(--gold-hi),inset 0 0 0 5px var(--edge),0 0 0 5px var(--gold),0 0 28px 6px rgba(242,210,122,.55)}}

/* the arrow that carries a run across the rail */
.zip{position:absolute;left:0;top:50%;width:230px;height:30px;margin-top:-15px;pointer-events:none;visibility:hidden;z-index:3}
.zip.go{visibility:visible;animation:zip .75s var(--ease-in) forwards}
@keyframes zip{from{transform:translateX(-240px)}to{transform:translateX(var(--run,900px))}}

/* rolling numerals: every value stacks in one grid cell and slides */
.roll{position:relative;display:inline-grid;overflow:hidden;vertical-align:bottom}
.roll > b{grid-area:1/1;font-weight:inherit;text-align:center}

/* situation box */
.sit{display:flex;align-items:center;gap:18px;padding:0 18px 0 18px;border-left:1px solid var(--rule)}
.inn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:56px;perspective:220px}
.inn .face{display:flex;flex-direction:column;align-items:center;gap:3px;transform-origin:50% 50%;backface-visibility:hidden}
.inn .arr{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;opacity:.22;transition:opacity .3s}
.inn .up{border-bottom:9px solid var(--gold-hi)} .inn .dn{border-top:9px solid var(--gold-hi)}
.inn .arr.on{opacity:1;filter:drop-shadow(0 0 5px rgba(242,210,122,.7))}
.inn .n{font-family:var(--varsity);font-size:27px;line-height:.95;color:var(--ink)}
.inn .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:.9;transform:rotateX(90deg);backface-visibility:hidden;color:var(--gold-hi)}
.inn .mid small{font-weight:700;font-size:15px;letter-spacing:.08em} .inn .mid b{font-family:var(--varsity);font-weight:400;font-size:26px}
.inn.flip .face{animation:flipOut .7s var(--ease-in) forwards}
.inn.flip .mid{animation:flipIn .7s .7s var(--ease-out) forwards}
.inn.flipback .face{animation:flipIn .6s var(--ease-out) forwards}
.inn.flipback .mid{animation:flipOut .5s var(--ease-in) forwards;transform:rotateX(0)}
@keyframes flipOut{from{transform:rotateX(0)}to{transform:rotateX(-90deg)}}
@keyframes flipIn{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}

.dia{width:62px;height:52px;overflow:visible}
.dia .b{fill:rgba(28,11,51,.6);stroke:rgba(242,210,122,.55);stroke-width:2.2;transform-box:fill-box;transform-origin:50% 50%;
  transition:fill .3s,stroke .3s}
.dia .b.on{fill:var(--gold-hi);stroke:#fff3c9;filter:drop-shadow(0 0 6px rgba(242,210,122,.85))}
.dia .b.pop{animation:basePop .55s var(--ease-out)}
@keyframes basePop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

.cnt{display:flex;flex-direction:column;align-items:center;gap:7px}
.bs{font-weight:700;font-size:31px;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:1px}
.bs .dash{opacity:.5;margin:0 1px}
.outs{display:flex;gap:6px}
.outs i{width:11px;height:11px;border-radius:50%;background:rgba(28,11,51,.8);box-shadow:inset 0 0 0 1.5px rgba(242,210,122,.45);transition:background .25s,box-shadow .25s}
.outs i.on{background:var(--gold-hi);box-shadow:0 0 8px rgba(242,210,122,.8)}
.outs i.pop{animation:basePop .5s var(--ease-out)}

/* ---------- Context strip: the at-bat, play tags, and his line ---------- */
.strip{position:relative;height:36px;margin:0 10px 0 22px;overflow:hidden;
  background:linear-gradient(180deg,#24103f,#170828);
  border-radius:0 0 7px 7px;box-shadow:inset 0 1px 0 var(--rule),0 0 0 1.5px rgba(201,162,74,.45)}
body[data-pos^="b"] .strip{border-radius:7px 7px 0 0}
.line{position:absolute;inset:0;display:flex;align-items:center;gap:12px;padding:0 14px;white-space:nowrap}
.line .tag{flex:0 0 auto;padding:3px 8px 2px;border-radius:3px;font-weight:700;font-size:17px;letter-spacing:.08em;line-height:1;
  background:rgba(242,210,122,.14);color:var(--ink)}
.line .tag.gold{background:var(--gold-hi);color:var(--purple-lo)}
.line .tag.red{background:var(--crimson);color:#fff}
.line .tag.green{background:var(--green);color:#06210f}
.line .tag.amber{background:var(--amber);color:#241100}
.line .txt{font-weight:700;font-size:22px;letter-spacing:.03em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
.line .side{margin-left:auto;font-weight:600;font-size:19px;letter-spacing:.05em;color:var(--dim);text-transform:uppercase}
.line .side b{color:var(--ink);font-weight:700;margin-left:6px}
.line.in{animation:lineIn .42s .14s var(--ease-out) both}
.line.out{animation:lineOut .3s var(--ease-in) both}
@keyframes lineIn{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
@keyframes lineOut{from{transform:none;opacity:1}to{transform:translateY(-100%);opacity:0}}
/* his line: the ribbon, and his name in varsity gold */
.line.mem{background:linear-gradient(90deg,rgba(242,210,122,.14),transparent 70%)}
.line.mem .rib{flex:0 0 auto;width:17px;height:29px;background:var(--ribbon) center/contain no-repeat}
.line.mem .txt{font-family:var(--varsity);font-weight:400;font-size:19px;letter-spacing:.05em;color:var(--gold-hi)}
.line.mem .side{color:var(--gold)}

/* ---------- Strikeout flag: a ribbon tail out the side of the rail ---------- */
.kflag{position:absolute;top:0;left:calc(100% + 10px);display:flex;align-items:stretch;height:72px;padding:5px 44px 5px 5px;
  clip-path:inset(0 100% 0 0);visibility:hidden;white-space:nowrap}
body[data-pos$="r"] .kflag{left:auto;right:calc(100% + 10px);padding:5px 5px 5px 44px;flex-direction:row-reverse}
body[data-pos^="b"] .kflag{top:auto;bottom:0}
/* a gold ribbon tail with a purple one inside it, notched at the far end */
.kflag::before,.kflag::after{content:"";position:absolute;z-index:-1}
.kflag::before{inset:0;border-radius:8px 0 0 8px;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));
  clip-path:polygon(0 0,100% 0,calc(100% - 30px) 50%,100% 100%,0 100%)}
.kflag::after{inset:4px 6px 4px 4px;border-radius:5px 0 0 5px;background:linear-gradient(180deg,var(--purple-hi),var(--purple-lo));
  clip-path:polygon(0 0,100% 0,calc(100% - 26px) 50%,100% 100%,0 100%)}
body[data-pos$="r"] .kflag::before{border-radius:0 8px 8px 0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,30px 50%)}
body[data-pos$="r"] .kflag::after{inset:4px 4px 4px 6px;border-radius:0 5px 5px 0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,26px 50%)}
.kflag .k{display:flex;align-items:center;justify-content:center;width:66px;border-radius:5px;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));font-family:var(--varsity);font-size:52px;line-height:1;color:var(--purple-lo)}
.kflag.looking .k span{display:inline-block;transform:scaleX(-1)}
.kflag .kt{display:flex;flex-direction:column;justify-content:center;padding:0 6px 0 16px;gap:5px}
body[data-pos$="r"] .kflag .kt{padding:0 16px 0 6px;align-items:flex-end}
.kflag .kt b{font-family:var(--varsity);font-weight:400;font-size:23px;line-height:1;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.kflag .kt small{font-weight:600;font-size:17px;line-height:1;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.kflag .kt small em{font-style:normal;color:var(--gold-hi)}
.kflag.play{visibility:visible;animation:flagIn 3.4s var(--ease-out) forwards}
body[data-pos$="r"] .kflag.play{animation-name:flagInR}
.kflag.play .k span{display:inline-block;animation:kSlam .5s .15s var(--ease-out) both}
.kflag.play.looking .k span{animation-name:kSlamL}
@keyframes flagIn{0%{clip-path:inset(0 100% 0 0)}14%,86%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 100%)}}
@keyframes flagInR{0%{clip-path:inset(0 0 0 100%)}14%,86%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
@keyframes kSlam{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes kSlamL{from{transform:scaleX(-1) scale(2.2);opacity:0}to{transform:scaleX(-1) scale(1);opacity:1}}

/* ---------- Home run: the arrow flies and a ribbon banner opens behind it ---------- */
.hrw{position:absolute;left:0;bottom:calc(100% + 18px);width:820px;height:124px;pointer-events:none;visibility:hidden}
body[data-pos^="t"] .hrw{bottom:auto;top:calc(100% + 18px)}
body[data-pos$="r"] .hrw{left:auto;right:0}
.hrw.play{visibility:visible}
.hr{position:absolute;inset:0;display:flex;align-items:center;gap:22px;padding:0 70px 0 22px;
  filter:drop-shadow(0 16px 30px rgba(0,0,0,.55));clip-path:inset(0 100% 0 0)}
/* the banner: a gold ribbon with swallowtail ends, a purple ribbon inside it */
.hr::before,.hr::after{content:"";position:absolute;z-index:-1}
.hr::before{inset:0;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));
  clip-path:polygon(0 0,100% 0,calc(100% - 40px) 50%,100% 100%,0 100%,40px 50%)}
.hr::after{inset:6px 8px;background:linear-gradient(180deg,var(--purple-hi),var(--purple) 45%,var(--purple-lo));
  clip-path:polygon(0 0,100% 0,calc(100% - 35px) 50%,100% 100%,0 100%,35px 50%)}
.hr .hrib{flex:0 0 auto;width:62px;height:106px;margin-left:34px;background:var(--ribbon) center/contain no-repeat;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.hr .hbody{display:flex;flex-direction:column;justify-content:center;gap:9px;flex:1;min-width:0}
.hr .t1{overflow:hidden;line-height:1;padding-top:4px}
.hr .t1 span{display:inline-block;font-family:var(--varsity);font-size:60px;letter-spacing:.02em;line-height:.95;text-transform:uppercase;
  color:var(--gold-hi);text-shadow:0 3px 0 var(--edge),0 0 18px rgba(242,210,122,.35)}
.hr .t2{overflow:hidden;display:flex;align-items:baseline;gap:14px;white-space:nowrap}
.hr .t2 b{font-weight:700;font-size:30px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink)}
.hr .t2 span{font-weight:700;font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-hi)}
.hr .t2 i{align-self:center;width:12px;height:12px;border-radius:3px;background:var(--tc);box-shadow:0 0 0 1.5px var(--gold-hi);flex:0 0 auto}
.hr .gleam{position:absolute;inset:6px 8px;pointer-events:none;overflow:hidden;
  clip-path:polygon(0 0,100% 0,calc(100% - 35px) 50%,100% 100%,0 100%,35px 50%)}
.hr .gleam::before{content:"";position:absolute;top:0;bottom:0;left:-30%;width:30%;
  background:linear-gradient(105deg,transparent,rgba(255,244,210,.35),transparent)}
.hrw .arrow{position:absolute;left:0;top:50%;width:260px;height:36px;margin-top:-18px;visibility:hidden;z-index:2}
.hrw.play .arrow{visibility:visible;animation:shoot .8s var(--ease-in) forwards}
@keyframes shoot{0%{transform:translateX(-300px);opacity:1}85%{opacity:1}100%{transform:translateX(860px);opacity:0}}
.hrw.play .hr{animation:hrOpen 5s linear forwards}
.hrw.play.wo .hr{animation-duration:7.4s}
@keyframes hrOpen{0%{clip-path:inset(0 100% 0 0);animation-timing-function:cubic-bezier(.7,0,.84,0)}
  16%{clip-path:inset(0 0 0 0)}88%{clip-path:inset(0 0 0 0);opacity:1;transform:none;animation-timing-function:cubic-bezier(.7,0,.84,0)}
  100%{clip-path:inset(0 0 0 0);opacity:0;transform:translateY(8px)}}
body[data-pos^="t"] .hrw.play .hr{animation-name:hrOpenT}
@keyframes hrOpenT{0%{clip-path:inset(0 100% 0 0);animation-timing-function:cubic-bezier(.7,0,.84,0)}
  16%{clip-path:inset(0 0 0 0)}88%{clip-path:inset(0 0 0 0);opacity:1;transform:none;animation-timing-function:cubic-bezier(.7,0,.84,0)}
  100%{clip-path:inset(0 0 0 0);opacity:0;transform:translateY(-8px)}}
.hrw.play .hrib{animation:ribPop .6s .7s var(--ease-out) both}
@keyframes ribPop{from{transform:scale(.3) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
.hrw.play .t1 span{animation:rise .55s .55s var(--ease-out) both}
.hrw.play .t2 > *{animation:riseFlat .5s .8s var(--ease-out) both}
.hrw.play .t2 span{animation-delay:.92s}
.hrw.play .gleam::before{animation:gleam 1.3s 1.2s var(--ease-out) both}
@keyframes rise{from{transform:translateY(110%)}to{transform:none}}
@keyframes riseFlat{from{transform:translateY(110%)}to{transform:none}}
@keyframes gleam{from{transform:translateX(0)}to{transform:translateX(480%)}}
/* gold sparks thrown off the banner as it lands */
.sparks{position:absolute;inset:0;pointer-events:none}
.sparks i{position:absolute;left:var(--x);top:50%;width:7px;height:7px;border-radius:50%;opacity:0;
  background:radial-gradient(circle,#fff6d6 0,var(--gold-hi) 45%,transparent 70%)}
.hrw.play .sparks i{animation:spark 1.3s var(--d) var(--ease-out) both}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}

/* ---------- The tribute: full frame, before the first pitch ---------- */
.hero{position:absolute;inset:0;display:none;pointer-events:none;z-index:10}
.hero.on{display:block}
.hero .veil{position:absolute;inset:0;opacity:0;
  background:radial-gradient(ellipse 70% 80% at 50% 50%,rgba(28,11,51,.62) 0%,rgba(14,5,26,.84) 70%,rgba(8,2,16,.92) 100%)}
.hero.on .veil{animation:veil 9.6s linear forwards}
@keyframes veil{0%{opacity:0}9%{opacity:1}80%{opacity:1}96%,100%{opacity:0}}
.hero .motes{position:absolute;inset:0;overflow:hidden}
.hero .motes i{position:absolute;bottom:-20px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;
  background:radial-gradient(circle,#fff5d0 0,rgba(242,210,122,.9) 40%,transparent 70%);opacity:0}
.hero.on .motes i{animation:mote var(--t) var(--d) linear infinite}
@keyframes mote{0%{transform:translate(0,0);opacity:0}12%{opacity:var(--o)}80%{opacity:var(--o)}100%{transform:translate(var(--dx),-1150px);opacity:0}}
.hero .wrap{position:absolute;left:0;right:0;top:50%;height:620px;margin-top:-310px;display:flex;align-items:center;justify-content:center;gap:80px}
.hero .hrib{position:relative;width:364px;height:620px;flex:0 0 auto;opacity:0}
.hero .hrib img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 20px 40px rgba(0,0,0,.6))}
.hero .hrib .halo{position:absolute;left:50%;top:40%;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(242,210,122,.34) 0%,rgba(242,210,122,.1) 38%,transparent 66%)}
.hero.on .hrib{animation:ribIn 1.6s .3s var(--ease-out) both}
@keyframes ribIn{from{opacity:0;transform:translateY(40px) scale(.88)}to{opacity:1;transform:none}}
.hero.on .halo{animation:halo 5.5s 1s ease-in-out both}
@keyframes halo{0%{opacity:0;transform:scale(.7)}35%{opacity:1;transform:scale(1)}100%{opacity:.75;transform:scale(1.06)}}
.hero .text{display:flex;flex-direction:column;align-items:flex-start;gap:14px;min-width:620px}
.hero .text small{font-weight:700;font-size:40px;letter-spacing:.32em;color:var(--dim);text-transform:uppercase;opacity:0}
.hero .text .nm{overflow:hidden;padding:8px 0 4px}
.hero .text .nm b{display:block;font-family:var(--varsity);font-weight:400;font-size:168px;line-height:.9;letter-spacing:.02em;color:var(--yellow);
  text-shadow:0 6px 0 var(--edge),0 0 40px rgba(242,210,122,.35)}
.hero .text .rule{display:block;width:100%;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--gold-hi),var(--gold) 60%,transparent);
  transform:scaleX(0);transform-origin:0 50%}
.hero .text .num{display:flex;align-items:center;gap:22px;opacity:0}
.hero .text .num span{font-family:var(--varsity);font-size:62px;line-height:1;color:var(--gold-hi);text-shadow:0 4px 0 var(--edge)}
.hero .text .num em{font-style:normal;font-weight:700;font-size:34px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
.hero.on .text small{animation:fadeUp .9s 1.3s var(--ease-out) both}
.hero.on .text .nm b{animation:nameUp 1.1s 1.8s var(--ease-out) both}
.hero.on .text .rule{animation:ruleDraw 1.2s 2.6s var(--ease-out) both}
.hero.on .text .num{animation:fadeUp 1s 3.1s var(--ease-out) both}
.hero.on .text{animation:textOut .7s 7.6s var(--ease-in) forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes nameUp{from{transform:translateY(105%)}to{transform:none}}
@keyframes ruleDraw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes textOut{to{opacity:0;transform:translateY(-12px)}}
.hero .hrib .shine::before{width:50%}
.hero.on .hrib .shine::before{animation:shine 2s 2.2s var(--ease-out) both}

/* ---------- First paint: the package builds out of the pin ---------- */
#bug.intro .medal{animation:pinIn .6s var(--ease-out) both}
#bug.intro .rail{animation:build .7s .15s var(--ease-out) both}
#bug.intro .strip{animation:lineIn .5s .5s var(--ease-out) both}
#bug.landed .rail{animation:build .8s var(--ease-out) both}
#bug.landed .strip{animation:lineIn .5s .4s var(--ease-out) both}
@keyframes pinIn{from{opacity:0;transform:scale(.5) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes build{from{clip-path:inset(0 100% 0 0);transform:translateX(-12px)}to{clip-path:inset(0 0 0 0);transform:none}}

@media (prefers-reduced-motion:reduce){
  .kflag.play{animation-duration:3s}
  .rail.sheen::after,.shine.go::before,.dia .b.pop,.outs i.pop,#bug.intro *,#bug.landed *,.hero.on .motes i,.zip.go{animation:none!important}
}
</style>
</head>
<body>
<div id="stage">
  <div id="bug">
    <div class="medal"><img src="img/forever20-ribbon.webp" alt=""><i class="shine"></i></div>
    <div class="main">
      <div class="rail">
        <div class="team" data-t="away"><div class="slab"><span class="ab"></span></div><div class="score"><span class="roll" data-k="away"></span></div></div>
        <div class="team" data-t="home"><div class="slab"><span class="ab"></span></div><div class="score"><span class="roll" data-k="home"></span></div></div>
        <div class="sit">
          <div class="inn">
            <div class="face"><i class="arr up"></i><span class="n roll" data-k="inning"></span><i class="arr dn"></i></div>
            <div class="mid"><small>MID</small><b>1</b></div>
          </div>
          <svg class="dia" viewBox="0 0 62 52" aria-hidden="true">
            <g class="b" data-b="2"><rect x="22" y="3" width="17" height="17" transform="rotate(45 30.5 11.5)"/></g>
            <g class="b" data-b="3"><rect x="5" y="22" width="17" height="17" transform="rotate(45 13.5 30.5)"/></g>
            <g class="b" data-b="1"><rect x="39" y="22" width="17" height="17" transform="rotate(45 47.5 30.5)"/></g>
          </svg>
          <div class="cnt">
            <div class="bs"><span class="roll" data-k="balls"></span><span class="dash">-</span><span class="roll" data-k="strikes"></span></div>
            <div class="outs"><i></i><i></i><i></i></div>
          </div>
        </div>
        <svg class="zip" viewBox="0 0 230 30" aria-hidden="true"><use href="#arrow"/></svg>
      </div>
      <div class="strip"></div>
    </div>
    <div class="kflag"><div class="k"><span>K</span></div><div class="kt"><b></b><small></small></div></div>
    <div class="hrw">
      <div class="hr">
        <div class="hrib"></div>
        <div class="hbody"><div class="t1"><span>Home run</span></div><div class="t2"><i></i><b></b><span></span></div></div>
        <div class="gleam"></div>
      </div>
      <div class="sparks"></div>
      <svg class="arrow" viewBox="0 0 230 30" aria-hidden="true"><use href="#arrow"/></svg>
    </div>
  </div>

  <div class="hero" aria-hidden="true">
    <div class="veil"></div>
    <div class="motes"></div>
    <div class="wrap">
      <div class="hrib"><i class="halo"></i><img src="img/forever20-ribbon.webp" alt=""><i class="shine"></i></div>
      <div class="text">
        <small>Tonight we play for</small>
        <div class="nm"><b>Julian</b></div>
        <i class="rule"></i>
        <div class="num"><span>#20</span><em>Sanger, TX</em></div>
      </div>
    </div>
  </div>
</div>

<!-- The ribbon's arrow: a gold trail, the shaft, a feather and the point. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="trail" x1="0" x2="1"><stop offset="0" stop-color="#f2d27a" stop-opacity="0"/><stop offset="1" stop-color="#f2d27a" stop-opacity=".85"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0c2"/><stop offset=".5" stop-color="#e2bd62"/><stop offset="1" stop-color="#8f6d25"/></linearGradient>
    <symbol id="arrow" viewBox="0 0 230 30">
      <rect x="0" y="13" width="120" height="4" rx="2" fill="url(#trail)"/>
      <rect x="92" y="13" width="112" height="4" rx="1.5" fill="url(#metal)" stroke="#3a1d10" stroke-width=".8"/>
      <path d="M96 15 L78 4 L112 12 Z M96 15 L78 26 L112 18 Z" fill="#f4e7c4" stroke="#8f6d25" stroke-width="1"/>
      <rect x="112" y="11.5" width="3" height="7" fill="#472a68"/><rect x="117" y="11.5" width="3" height="7" fill="#472a68"/>
      <path d="M200 6 L229 15 L200 24 L205 15 Z" fill="url(#metal)" stroke="#3a1d10" stroke-width="1"/>
    </symbol>
  </defs>
</svg>

<script src="kit.js"></script>
<script>
(() => {
  const { $, $$, restart, battingTeam, params } = BugKit;
  const stage = $("#stage"), bug = $("#bug"), rail = $(".rail"), strip = $(".strip"), hrw = $(".hrw"), kflag = $(".kflag"), inn = $(".inn");
  const medal = $(".medal"), hero = $(".hero");
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const up = (t) => String(t ?? "").toUpperCase();
  const words = (n) => String(n || "").trim().split(/\s+/).filter(Boolean);
  const surname = (n) => { const w = words(n); return w.length ? w[w.length - 1] : ""; };
  const ordinal = (n) => { const s = ["TH", "ST", "ND", "RD"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
  const abbrOf = (S, t) => up(S[t].abbr || S[t].name);
  const team = (t) => $(`.team[data-t="${t}"]`);
  const embed = params.get("embed") === "1";
  let cur = null, flipTimer = null;
  const ks = new Map();   // strikeouts by pitcher, this broadcast

  /* ---------- Rolling numerals ---------- */
  function roll(el, val, instant) {
    const v = String(val);
    if (el.dataset.v === v) return;
    const from = Number(el.dataset.v);
    el.dataset.v = v;
    const old = el.lastElementChild;
    if (instant || !old) { el.innerHTML = `<b>${esc(v)}</b>`; return; }
    const d = Number.isFinite(from) && Number(v) < from ? -1 : 1;   // a count clearing rolls back down
    const nu = document.createElement("b");
    nu.textContent = v;
    el.appendChild(nu);
    old.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: `translateY(${-90 * d}%)`, opacity: 0 }],
      { duration: 300, easing: "cubic-bezier(.7,0,.84,0)", fill: "forwards" }).onfinish = () => old.remove();
    nu.animate([{ transform: `translateY(${90 * d}%)`, opacity: 0 }, { transform: "translateY(0)", opacity: 1 }],
      { duration: 420, delay: 90, easing: "cubic-bezier(.16,1,.3,1)", fill: "backwards" });
  }

  /* ---------- The strip: the at-bat, or a play tag for a moment ---------- */
  let holdUntil = 0, holdTimer = null, lastSay = { at: 0 };
  function setLine(main, side, animate, cls) {
    const old = strip.querySelector(".line:not(.out)");
    if (old && old.dataset.main === main) {            // same at-bat: just refresh the pitch count
      const sd = old.querySelector(".side");
      if (sd && sd.innerHTML !== side) sd.innerHTML = side;
      return;
    }
    const nu = document.createElement("div");
    nu.className = "line" + (cls ? " " + cls : "");
    nu.dataset.main = main;
    nu.innerHTML = main + (side != null ? `<span class="side">${side}</span>` : "");
    if (old) {
      if (animate) { old.classList.add("out"); setTimeout(() => old.remove(), 320); nu.classList.add("in"); }
      else old.remove();
    }
    strip.appendChild(nu);
  }
  function atBat(S, animate) {
    const pc = S.pitchCount ? `<b>${S.pitchCount}</b>` : "";
    const side = S.pitcher ? `P · ${esc(up(surname(S.pitcher)))}${pc}` : pc ? `Pitches${pc}` : "";
    // No lineup, no name: the strip carries where the inning stands instead.
    const outs = S.outs === 1 ? "1 out" : `${Math.min(S.outs, 2)} outs`;
    const main = S.batter ? `<span class="tag">AB</span><span class="txt">${esc(up(S.batter))}</span>`
      : `<span class="tag">${S.half === "top" ? "TOP" : "BOT"} ${S.inning}</span><span class="txt">${esc(up(outs))}</span>`;
    setLine(main, side, animate);
  }
  function say(tag, cls, text, ms = 2800) {
    lastSay = { tag, cls, text, at: Date.now() };
    holdUntil = Date.now() + ms;
    setLine(`<span class="tag ${cls}">${esc(tag)}</span><span class="txt">${esc(up(text))}</span>`, null, true);
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => { holdUntil = 0; if (cur) atBat(cur, true); }, ms);
  }

  /* ---------- Remembering him ----------
     His line comes round in the strip between innings (at most every few
     minutes) and, in a long quiet spell, on its own. The pin catches the
     light every so often all game. */
  const MEM_GAP = 4 * 60e3, MEM_IDLE = 8 * 60e3;
  let lastMem = Date.now() - MEM_GAP + 90e3;   // first one about a minute and a half in
  function shineMedal() { restart($(".shine", medal), "go"); }
  function remember(ms = 6500) {
    lastMem = Date.now();
    holdUntil = Date.now() + ms;
    setLine(`<span class="rib"></span><span class="txt">In memory of Julian</span>`, `#20 · Sanger, TX`, true, "mem");
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => { holdUntil = 0; if (cur) atBat(cur, true); }, ms);
    restart(medal, "glow");
    shineMedal();
  }
  setInterval(shineMedal, 17e3);
  setInterval(() => {
    const now = Date.now();
    if (!cur || heroBusy || now < holdUntil + 15e3 || now - lastSay.at < 20e3) return;
    if (now - lastMem > MEM_IDLE) remember();
  }, 30e3);

  /* ---------- The arrow ---------- */
  function zip() {
    const z = $(".zip");
    z.style.setProperty("--run", rail.offsetWidth + 40 + "px");
    restart(z, "go");
  }
  const sparks = $(".sparks");
  sparks.innerHTML = Array.from({ length: 16 }, (_, i) => {
    const x = 90 + Math.random() * 640, a = Math.random() * Math.PI * 2, r = 50 + Math.random() * 90;
    return `<i style="--x:${x | 0}px;--dx:${(Math.cos(a) * r) | 0}px;--dy:${(Math.sin(a) * r * .8) | 0}px;--d:${(.55 + Math.random() * .5).toFixed(2)}s"></i>`;
  }).join("");
  function banner(S, t, title, who, what, wo) {
    const hr = $(".hr", hrw);
    hr.style.setProperty("--tc", S[t].color);
    $(".t1 span", hr).textContent = title;
    $(".t2 b", hr).textContent = who || abbrOf(S, t);
    $(".t2 span", hr).textContent = what;
    hrw.classList.toggle("wo", !!wo);
    restart(hrw, "play");
    setTimeout(() => restart(rail, "sheen"), 600);
    setTimeout(() => { restart(medal, "glow"); shineMedal(); }, 900);
  }

  /* ---------- The tribute (full frame, before the first pitch) ----------
     Plays once, when the bug first shows on a game that hasn't started: the
     ribbon rises in the middle of the frame, his name beside it, gold light
     drifting up; then the ribbon folds down into the pin and the bug builds
     out of it. Inside the live overlay it waits while a full-frame card
     (Starting Soon) hides the bug, so it plays when the field comes up.
     ?tribute=1 forces it on the demo page; ?tribute=0 turns it off. */
  let heroBusy = false;
  const motes = $(".motes", hero);
  motes.innerHTML = Array.from({ length: 30 }, () => {
    const s = 4 + Math.random() * 7, t = 7 + Math.random() * 6;
    return `<i style="--x:${(Math.random() * 100).toFixed(1)}%;--s:${s.toFixed(1)}px;--t:${t.toFixed(1)}s;--d:${(-Math.random() * t).toFixed(1)}s;--dx:${((Math.random() - .5) * 160) | 0}px;--o:${(.35 + Math.random() * .5).toFixed(2)}"></i>`;
  }).join("");
  const pregame = (S) => S.inning === 1 && S.half === "top" && !S.outs && !S.balls && !S.strikes &&
    !S.away.r && !S.home.r && !S.bases.some(Boolean);
  const shown = () => {
    try { const f = window.frameElement; return !f || getComputedStyle(f).visibility !== "hidden"; } catch { return true; }
  };
  function playHero() {
    heroBusy = true;
    bug.classList.add("await");
    hero.classList.remove("on"); void hero.offsetWidth; hero.classList.add("on");
    setTimeout(() => fold(), 7900);
  }
  function fold() {
    // Fly the big ribbon onto the pin, in stage pixels.
    const big = $(".hrib", hero), s = stage.getBoundingClientRect().width / 1920;
    const a = big.getBoundingClientRect(), b = medal.getBoundingClientRect();
    const dx = (b.left + b.width / 2 - (a.left + a.width / 2)) / s, dy = (b.top + b.height / 2 - (a.top + a.height / 2)) / s;
    const k = b.height / a.height;
    big.animate([{ transform: "none" }, { transform: `translate(${dx}px,${dy}px) scale(${k})` }],
      { duration: 1100, easing: "cubic-bezier(.65,0,.35,1)", fill: "forwards" }).onfinish = () => {
      bug.classList.remove("await");
      restart(bug, "landed");
      restart(medal, "glow"); shineMedal();
      setTimeout(() => { hero.classList.remove("on"); big.getAnimations().forEach((x) => x.cancel()); heroBusy = false; lastMem = Date.now(); }, 900);
    };
  }
  let heroArmed = params.get("tribute") !== "0";
  function maybeHero(S) {
    if (!heroArmed) return false;
    heroArmed = false;
    if (params.get("tribute") !== "1" && !pregame(S)) return false;
    if (shown()) { playHero(); return true; }
    bug.classList.add("await");
    const wait = setInterval(() => { if (shown()) { clearInterval(wait); playHero(); } }, 400);
    return true;
  }

  /* ---------- Paint ---------- */
  BugKit.start({
    name: "Forever 20",
    hrDelay: 2400,
    render(S, prev, first) {
      cur = S;
      for (const t of ["away", "home"]) {
        const el = team(t);
        el.style.setProperty("--tc", S[t].color);
        $(".ab", el).textContent = abbrOf(S, t);
        roll($(".score .roll", el), S[t].r, first);
        el.classList.toggle("bat", battingTeam(S) === t);
      }
      roll($(".inn .n"), S.inning, first);
      $(".inn .up").classList.toggle("on", S.half === "top");
      $(".inn .dn").classList.toggle("on", S.half !== "top");
      $$(".dia .b").forEach((g) => {
        const i = +g.dataset.b - 1, on = !!S.bases[i];
        if (on && !g.classList.contains("on") && !first) restart(g, "pop");
        g.classList.toggle("on", on);
      });
      // the count never reads four balls or three strikes; the play says that
      roll($('.roll[data-k="balls"]'), Math.min(S.balls, 3), first);
      roll($('.roll[data-k="strikes"]'), Math.min(S.strikes, 2), first);
      $$(".outs i").forEach((d, i) => {
        const on = i < S.outs;
        if (on && !d.classList.contains("on") && !first) restart(d, "pop");
        d.classList.toggle("on", on);
      });
      if (first) { atBat(S, false); if (!maybeHero(S)) restart(bug, "intro"); }
      else if (Date.now() > holdUntil) atBat(S, true);
    },
    fx: {
      run({ team: t, runs = 1, hr: homer }, S) {
        t ||= battingTeam(S);
        zip();
        setTimeout(() => { restart(team(t), "flash"); restart(rail, "sheen"); }, homer ? 0 : 380);
        if (homer) return;                                   // the banner already said it
        const scored = runs === 1 ? "Run scores" : `${runs} runs score`;
        if (Date.now() - lastSay.at < 250) say(lastSay.tag, lastSay.cls, `${lastSay.text} · ${scored}`);
        else say("RUN", "gold", `${scored} · ${abbrOf(S, t)} ${S[t].r}`);
      },
      hr({ runs = 1, batter, team: t }, S) {
        t ||= battingTeam(S);
        const who = batter || S.batter;
        const what = runs === 4 ? "Four runs score" : runs === 1 ? "Solo homer" : `${runs}-run homer`;
        banner(S, t, runs === 4 ? "Grand slam" : "Home run", who ? `${who} · ${abbrOf(S, t)}` : abbrOf(S, t), what);
        const kind = runs === 1 ? "solo" : runs === 4 ? "grand slam" : runs + "-run";
        say("HR", "gold", who ? `${who} · ${kind}` : `${kind} home run`, 5200);
      },
      k({ looking, batter }, S) {
        const ft = S.half === "top" ? "home" : "away";
        const who = S.pitcher || abbrOf(S, ft);
        // The live game keeps the pitcher's strikeouts on its row (S[team].k);
        // the demo counts them here.
        ks.set(who, (ks.get(who) || 0) + 1);
        const n = S[ft].k > 0 ? S[ft].k : ks.get(who);
        kflag.classList.toggle("looking", !!looking);
        $(".kt b", kflag).textContent = looking ? "Called strike three" : "Strikes out swinging";
        const bat = surname(batter || S.batter);
        $(".kt small", kflag).innerHTML = `${bat ? esc(up(bat)) + " · " : ""}${esc(up(surname(who)))} <em>${n}K</em>`;
        restart(kflag, "play");
        const b = batter || S.batter;
        say(looking ? "ꓘ" : "K", "red", b ? `${b} ${looking ? "caught looking" : "strikes out"}` : looking ? "Called strike three" : "Strikeout swinging");
      },
      hit({ bases = 1, batter }) { say(["SINGLE", "DOUBLE", "TRIPLE"][bases - 1] || "HIT", "gold", batter || "Base hit"); },
      walk({ batter }) { say("WALK", "green", batter ? `${batter} takes first` : "Ball four"); },
      error({ team: t }, S) { say("E", "amber", `Error · ${abbrOf(S, t || (S.half === "top" ? "home" : "away"))}`); },
      out({ batter }, S) { say("OUT", "", batter || (S.outs >= 3 ? "Side retired" : S.outs === 2 ? "Two down" : "One down"), 1800); },
      half({ inning, half }, S) {
        const was = half === "bot" ? inning : inning - 1;          // the half that just ended
        $(".inn .mid small").textContent = half === "bot" ? "MID" : "END";
        $(".inn .mid b").textContent = was;
        inn.classList.remove("flipback");
        restart(inn, "flip");
        clearTimeout(flipTimer);
        flipTimer = setTimeout(() => { inn.classList.remove("flip"); restart(inn, "flipback"); }, 2600);
        say(`${half === "bot" ? "MID" : "END"} ${ordinal(was)}`, "gold", `${abbrOf(S, battingTeam(S))} coming to bat`, 2600);
        if (Date.now() - lastMem > MEM_GAP) setTimeout(() => { if (Date.now() >= holdUntil) remember(); }, 2700);
      },
      walkoff({ team: t, batter }, S) {
        t ||= battingTeam(S);
        const o = t === "away" ? "home" : "away";
        const line = `${abbrOf(S, t)} win ${S[t].r}-${S[o].r}`;
        banner(S, t, "Walk-off", batter || S.batter || abbrOf(S, t), line, true);
        restart(team(t), "win");
        say("WALK-OFF", "gold", line, 7000);
      },
      reset() { ks.clear(); restart(bug, "intro"); }
    }
  });

  // Demo page: a button to play the tribute again.
  const demo = $("#demo");
  if (demo) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<button data-f20="hero">Play the tribute</button><button data-f20="mem">His line</button>`;
    demo.querySelector("p").before(row);
    row.addEventListener("click", (e) => {
      const b = e.target.closest("[data-f20]");
      if (!b) return;
      if (b.dataset.f20 === "hero" && !heroBusy) playHero();
      if (b.dataset.f20 === "mem") remember();
    });
  }
